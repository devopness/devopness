version: 2
updates:
  # The pnpm workspace covers the root plus apps/api-docs,
  # packages/sdks/javascript and packages/ui/react. Dependabot's npm ecosystem
  # reads pnpm-lock.yaml, so one entry here replaces the three that existed when
  # each package installed independently.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      # Group naming: unprefixed = repo-wide, sdk-js-* / ui-react-* =
      # package-specific.
      linters:
        patterns:
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "eslint"
          - "@eslint/*"
          - "eslint-*"
          - "oxlint"
          - "oxfmt"
          - "prettier"
          - "prettier-*"
          - "typescript"
      sdk-js:
        patterns:
          - "typescript"
          - "vite-plus"
          - "vite-*"
          - "@types/parse-link-header"
          - "axios"
          - "axios-mock-adapter"
          - "typedoc"
          - "husky"
      ui-react:
        patterns:
          - "typescript"
          - "vite-plus"
          - "vite"
          - "@vitejs/*"
          - "vite-*"
          - "vitest"
          - "@vitest/*"
      ui-react-storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
          - "eslint-plugin-storybook"

  - package-ecosystem: pip
    directories:
      - "/packages/sdks/python"
    schedule:
      interval: daily
    open-pull-requests-limit: 10

  # `docs` is deliberately excluded from the pnpm workspace: the workspace
  # cannot hold both its React 19 and the design system's React 18 in one
  # resolution. It installs independently and keeps its own lockfile.
  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      # Group naming: docs-* = scoped to the /docs npm ecosystem.
      docs:
        patterns:
          - "vite-plus"
          - "vite-*"
          - "typescript"
          - "@types/node"
          - "@types/react"
          - "@types/react-dom"
          - "@types/mdx"
      docs-fumadocs:
        patterns:
          - "fumadocs-*"
      docs-next:
        patterns:
          - "next"
      docs-tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
