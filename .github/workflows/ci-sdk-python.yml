name: CI - SDK Python
on:
  pull_request:
    types:
      - opened
      - synchronize

defaults:
  run:
    working-directory: packages/sdks/python

jobs:
  detect-changes:
    name: Detect changes in SDK-Python
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      changes: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            changes:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'packages/sdks/common/**'
              - 'packages/sdks/python/**'

  build:
    name: Build SDK-Python
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.changes == 'true' }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        python:
          - 3.13
          - 3.12
          - 3.11
        os:
          - ubuntu-latest

    env:
      PYTHON_VERSION: ${{ matrix.python }}
      # Pinned rather than auto-detected. The Makefile prefers podman and falls
      # back to docker, which is right on a developer machine and wrong in CI:
      # the runner image ships both, so the engine would change silently
      # whenever the image does, and a rootless-podman failure on the runner is
      # far harder to diagnose than a docker one. Changing this is a deliberate
      # act, not a side effect of a base-image bump.
      CONTAINER_ENGINE: docker

    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Build Docker Image
        run: make build-image

      - name: Build SDK - Python
        run: make build-sdk-python

      - name: Lint SDK - Python
        run: make lint

      - name: Test SDK - Python
        run: make test-unit

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'docs: Update auto generated models'
          file_pattern: 'packages/sdks/python/*'
          commit_user_name: ${{ vars.DEVOPNESS_AUTOMATIONS_USERNAME }}
          commit_user_email: ${{ vars.DEVOPNESS_AUTOMATIONS_EMAIL }}

  verify-build:
    name: Verify build of SDK-Python
    needs: [build, detect-changes]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Fail if build did not succeed
        run: |
          if [ "${{ needs.build.result }}" = "failure" ] || [ "${{ needs.build.result }}" = "cancelled" ]; then
            echo "❌ Build job failed or was cancelled"
            exit 1
          fi

          echo "✅ Build job succeeded or was skipped"
