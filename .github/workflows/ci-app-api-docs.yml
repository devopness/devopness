name: CI - API Docs

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

concurrency: ${{ github.workflow }}-${{ github.head_ref || github.ref }}

jobs:
  detect-changes:
    name: Detect changes in API Docs
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      changes: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            changes:
              - 'apps/api-docs/**'
              - 'docs/openapi.json'
              - 'packages/sdks/common/spec.json'
              - '.github/workflows/ci-app-api-docs.yml'
              - '.github/workflows/sync-api-spec.yml'
          base: ${{ github.event.pull_request.base.sha }}
          ref: ${{ github.event.pull_request.head.sha }}

  build:
    name: Build API Docs
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.changes == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-docs
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 0

      - name: Create `.env`
        run: |
          if [ -n "${{ secrets.API_DOCS_ENV_FILE }}" ]; then
            printf '%s\n' "${{ secrets.API_DOCS_ENV_FILE }}" > .env
          else
            cp .env.example .env
          fi

      - name: Setup Node Runtime
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API docs package
        run: |
          npm run api-build-spec
          npm run api-convert-spec-to-json
          npm run api-docs-export-page
          npm run tsc
          npm run test
          npm run ensure_index_file_is_on_size_limit

      # For security, we skip Dredd on fork PRs because it needs secrets.
      - name: Run Dredd
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          npm run api-convert-spec-to-dredd
          npm run remove-descriptions
          dredd

  sync-spec:
    name: Sync shared API spec
    needs: [build, detect-changes]
    if: ${{ needs.detect-changes.outputs.changes == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout automation branch
        run: git checkout -B "${{ github.head_ref }}"

      - name: Set up git identity
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config --global user.email "${{ vars.DEVOPNESS_AUTOMATIONS_EMAIL }}"
          git config --global user.name "${{ vars.DEVOPNESS_AUTOMATIONS_USERNAME }}"
          git remote set-url origin https://x-access-token:${{ secrets.DEVOPNESS_AUTOMATION_PAT }}@github.com/${{ github.repository }}

      - name: Build shared API spec from source
        working-directory: apps/api-docs
        run: |
          # Build one base spec here so both outputs use the same source data.
          npm run api-build-spec
          npm run api-convert-spec-to-json
          cp docs/build/spec.json "${{ runner.temp }}/api-docs-spec-base.json"

      # The package copy keeps the shared JSON lean.
      - name: Copy shared API spec into packages
        working-directory: ${{ github.workspace }}
        run: |
          cp "${{ runner.temp }}/api-docs-spec-base.json" packages/sdks/common/spec.json
          node apps/api-docs/src/utils/remove-descriptions-in-json-spec.js packages/sdks/common/spec.json

      # The docs copy keeps the markdown description refs inline for the site.
      - name: Copy docs OpenAPI into docs app
        working-directory: ${{ github.workspace }}
        run: |
          node apps/api-docs/src/utils/resolve-descriptions-in-json-spec.js \
            "${{ runner.temp }}/api-docs-spec-base.json" \
            docs/openapi.json

      - name: Fail if spec is out of sync on fork PRs
        if: github.event.pull_request.head.repo.full_name != github.repository
        working-directory: ${{ github.workspace }}
        run: |
          if ! git diff --exit-code -- packages/sdks/common/spec.json docs/openapi.json; then
            echo "❌ Generated API docs JSON differs from the committed files."
            echo "Fork PRs cannot auto-commit generated output. Regenerate locally and push the result."
            exit 1
          fi

      - name: Commit shared spec updates
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'feat: update shared API spec'
          file_pattern: |
            packages/sdks/common/spec.json
            docs/openapi.json
          commit_user_name: ${{ vars.DEVOPNESS_AUTOMATIONS_USERNAME }}
          commit_user_email: ${{ vars.DEVOPNESS_AUTOMATIONS_EMAIL }}

  verify-build:
    name: Verify build of API Docs
    needs: [detect-changes, build, sync-spec]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if build did not succeed
        run: |
          if [ "${{ needs.detect-changes.result }}" != "success" ]; then
            echo "❌ Change detection failed or was cancelled"
            exit 1
          fi

          if [ "${{ needs.detect-changes.outputs.changes }}" != "true" ]; then
            echo "✅ Build job succeeded or was skipped"
            exit 0
          fi

          if [ "${{ needs.build.result }}" = "failure" ] || [ "${{ needs.build.result }}" = "cancelled" ]; then
            echo "❌ Build job failed or was cancelled"
            exit 1
          fi

          if [ "${{ needs.sync-spec.result }}" = "failure" ] || [ "${{ needs.sync-spec.result }}" = "cancelled" ]; then
            echo "❌ Sync job failed or was cancelled"
            exit 1
          fi

          echo "✅ Build job succeeded or was skipped"
