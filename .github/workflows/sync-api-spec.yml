name: Sync - API Spec

on:
  repository_dispatch:
    types:
      - sync-api-spec

permissions:
  contents: write
  pull-requests: write

concurrency: ${{ github.workflow }}

jobs:
  sync-api-spec:
    name: Import auto generated models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/api-docs/package-lock.json

      - name: Install dependencies
        working-directory: apps/api-docs
        run: npm ci

      - name: Resolve artifact coordinates
        id: artifact
        run: |
          RUN_ID="${{ github.event.client_payload.run_id }}"
          ARTIFACT_NAME="${{ github.event.client_payload.artifact_name || 'api-docs-zip' }}"

          if [ -z "$RUN_ID" ]; then
            echo "repository_dispatch must provide a run id"
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Download generated API docs artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.DEVOPNESS_AUTOMATION_PAT }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.artifact.outputs.run_id }}
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: apps/api-docs/docs

      - name: Import auto generated models
        working-directory: apps/api-docs
        run: bash ./import-models-from-zip.sh

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.DEVOPNESS_AUTOMATION_PAT }}
          branch: feat/update-auto-generated-models
          title: 'feat: update auto generated models'
          commit-message: 'feat: update auto generated models'
          body: |
            ## Description of changes
            - [x] Import the generated API docs archive into `apps/api-docs`.

            ## GitHub issues resolved by this PR
            N/A

            ## Quality Assurance
            - [x] `sync-api-spec.yml` completed successfully and updated `apps/api-docs/docs/spec/**`.

            ## More info
            - Auto-generated by `sync-api-spec.yml`.
          add-paths: |
            apps/api-docs/docs/spec/**
