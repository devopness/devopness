name: Sync - API Spec

on:
  repository_dispatch:
    types: ['Automation: Import models to pull request']

permissions:
  contents: write
  pull-requests: write

concurrency: ${{ github.workflow }}

jobs:
  sync-api-spec:
    name: Import auto generated models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/api-docs/package-lock.json

      - name: Install dependencies
        working-directory: apps/api-docs
        run: npm ci

      - name: Create `.env`
        working-directory: apps/api-docs
        run: |
          if [ -n "${{ secrets.API_DOCS_ENV_FILE }}" ]; then
            printf '%s\n' "${{ secrets.API_DOCS_ENV_FILE }}" > .env
          else
            cp .env.example .env
          fi

      - name: Prepare automation branch
        run: |
          git fetch origin feat/update-auto-generated-models || true

          if git show-ref --verify --quiet refs/remotes/origin/feat/update-auto-generated-models; then
            git checkout -B feat/update-auto-generated-models origin/feat/update-auto-generated-models
          else
            git checkout -b feat/update-auto-generated-models
          fi

      - name: Import auto generated models
        working-directory: apps/api-docs
        run: |
          # Sourcing the .env file so the AWS credentials from the secret are available.
          set -a
          . ./.env
          set +a

          export AWS_ACCESS_KEY_ID="$CREDENTIAL_AWS_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$CREDENTIAL_AWS_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=us-east-1

          npm run api-docs-zip-download
          npm run api-docs-zip-extract
          npm run api-docs-make-description-files

      - name: Detect generated changes
        id: changes
        run: |
          if git diff --quiet -- apps/api-docs/docs/spec; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated changes
        if: steps.changes.outputs.has_changes == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'feat: update auto generated models'
          file_pattern: 'apps/api-docs/docs/spec/**'
          commit_user_name: ${{ vars.DEVOPNESS_AUTOMATIONS_USERNAME }}
          commit_user_email: ${{ vars.DEVOPNESS_AUTOMATIONS_EMAIL }}

      - name: Generate pull request title
        id: pr-title
        run: |
          echo "title=$(date +'feat: %Y-%m-%d %H:%M - Update auto generated models')" >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.DEVOPNESS_AUTOMATION_PAT }}
          script: |
            const title = `${{ steps.pr-title.outputs.title }}`;
            const body = `This PR is auto generated to update auto generated models and endpoints.`;

            const { data: existingPulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:feat/update-auto-generated-models`,
              base: 'main',
            });

            if (existingPulls.length > 0) {
              core.info(`PR already exists: #${existingPulls[0].number}`);
              return;
            }

            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              head: 'feat/update-auto-generated-models',
              base: 'main',
              body,
            });
