name: Sync - API Spec

on:
  repository_dispatch:
    types: ['Automation: Import models to pull request']

permissions:
  contents: write
  pull-requests: write

concurrency: ${{ github.workflow }}

jobs:
  sync-api-spec:
    name: Import auto generated models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node Runtime
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/api-docs/package-lock.json

      - name: Install dependencies
        working-directory: apps/api-docs
        run: npm ci

      - name: Create `.env`
        working-directory: apps/api-docs
        run: |
          if [ -n "${{ secrets.API_DOCS_ENV_FILE }}" ]; then
            printf '%s\n' "${{ secrets.API_DOCS_ENV_FILE }}" > .env
          else
            cp .env.example .env
          fi

      - name: Prepare automation branch
        run: |
          git fetch origin feat/update-auto-generated-models || true

          if git show-ref --verify --quiet refs/remotes/origin/feat/update-auto-generated-models; then
            git checkout -B feat/update-auto-generated-models origin/feat/update-auto-generated-models
          else
            git checkout -b feat/update-auto-generated-models
          fi

      - name: Import auto generated models
        run: bash .github/scripts/sync-api-spec-import-auto-generated-models.sh

      - name: Detect generated changes
        id: changes
        run: |
          if git diff --quiet -- apps/api-docs/docs/spec; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated changes
        if: steps.changes.outputs.has_changes == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'feat: update auto generated models'
          file_pattern: 'apps/api-docs/docs/spec/**'
          commit_user_name: ${{ vars.DEVOPNESS_AUTOMATIONS_USERNAME }}
          commit_user_email: ${{ vars.DEVOPNESS_AUTOMATIONS_EMAIL }}

      - name: Create or update pull request
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.DEVOPNESS_AUTOMATION_PAT }}
          script: |
            const path = require('path');
            const { createOrUpdatePullRequest } = require(path.join(process.env.GITHUB_WORKSPACE, '.github/scripts/sync-api-spec-create-or-update-pr.js'));

            await createOrUpdatePullRequest({ github, context, core });
