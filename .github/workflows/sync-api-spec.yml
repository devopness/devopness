name: Sync - API Spec

on:
  repository_dispatch:
    types:
      - sync-api-spec
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency: ${{ github.workflow }}

jobs:
  sync-api-spec:
    name: Sync shared API spec
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-docs
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.DEVOPNESS_AUTOMATION_PAT }}

      - name: Set up git identity
        run: |
          git config --global user.email "${{ vars.DEVOPNESS_AUTOMATIONS_EMAIL }}"
          git config --global user.name "${{ vars.DEVOPNESS_AUTOMATIONS_USERNAME }}"

      - name: Create `.env`
        run: |
          if [ -n "${{ secrets.DEV_API_DOCS_ENV_FILE }}" ]; then
            printf '%s\n' "${{ secrets.DEV_API_DOCS_ENV_FILE }}" > .env
          else
            cp .env.example .env
          fi

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate shared API spec
        run: |
          npm run api-build-spec
          npm run api-convert-spec-to-json
          npm run remove-descriptions-in-json-spec

      - name: Copy shared spec into SDK folder
        run: cp docs/build/spec.json ../../packages/sdks/common/spec.json

      - name: Create sync branch
        working-directory: ${{ github.workspace }}
        run: |
          git checkout -B bot/sync-api-spec origin/${{ github.event.repository.default_branch }}

      - name: Commit and push spec changes
        id: commit
        working-directory: ${{ github.workspace }}
        run: |
          if git diff --quiet -- packages/sdks/common/spec.json; then
            echo "✅ Shared spec is already up to date."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add packages/sdks/common/spec.json
          git commit -m "feat: sync shared API spec"
          git push --force-with-lease origin bot/sync-api-spec
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        if: steps.commit.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEVOPNESS_AUTOMATION_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = 'bot/sync-api-spec';
            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${head}`,
            });

            if (prs.length > 0) {
              core.info(`PR already exists: #${prs[0].number}`);
              return;
            }

            await github.rest.pulls.create({
              owner,
              repo,
              title: 'chore: sync shared API spec',
              head,
              base: context.payload.repository.default_branch,
              body: [
                '## Description of changes',
                '- [x] Sync `packages/sdks/common/spec.json` from the current API Docs source.',
                '',
                '## GitHub issues resolved by this PR',
                'N/A',
                '',
                '## Quality Assurance',
                '- [x] `sync-api-spec.yml` completed successfully and pushed the updated `packages/sdks/common/spec.json` file.',
                '',
                '## More info',
                '- Auto-generated by `sync-api-spec.yml`.',
              ].join('\n'),
            });
