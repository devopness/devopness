name: Sync - API Spec

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - sync-api-spec

permissions:
  contents: write
  pull-requests: write

concurrency: ${{ github.workflow }}

jobs:
  sync-api-spec:
    name: Import auto generated models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/api-docs/package-lock.json

      - name: Install dependencies
        working-directory: apps/api-docs
        run: npm ci

      - name: Create `.env`
        working-directory: apps/api-docs
        run: |
          if [ -n "${{ secrets.DEV_API_DOCS_ENV_FILE }}" ]; then
            printf '%s\n' "${{ secrets.DEV_API_DOCS_ENV_FILE }}" > .env
          else
            cp .env.example .env
          fi

      - name: Import auto generated models
        working-directory: apps/api-docs
        run: |
          # Sourcing the .env file so the AWS credentials from the secret are available.
          set -a
          . ./.env
          set +a

          export AWS_ACCESS_KEY_ID="$CREDENTIAL_AWS_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$CREDENTIAL_AWS_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=us-east-1

          npm run api-docs-zip-download
          npm run api-docs-zip-extract
          npm run api-docs-make-description-files

      - name: Generate pull request title
        id: pr-title
        run: |
          echo "title=feat: $(date -u '+%Y-%m-%d %H:%M UTC') - sync API spec" >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.DEVOPNESS_AUTOMATION_PAT }}
          branch: automation/sync-api-spec
          base: main
          title: ${{ steps.pr-title.outputs.title }}
          commit-message: 'feat: update auto generated models'
          body: |
            ## Description of changes
            - [x] Import the generated API docs archive into `apps/api-docs`.

            ## GitHub issues resolved by this PR
            N/A

            ## Quality Assurance
            - [x] `sync-api-spec.yml` completed successfully and updated `apps/api-docs/docs/spec/**`.

            ## More info
            - Auto-generated by `sync-api-spec.yml`.
          add-paths: |
            apps/api-docs/docs/spec/**
