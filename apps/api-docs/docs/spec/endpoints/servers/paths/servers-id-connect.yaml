summary: Connect a server to devopness platform
tags:
  - Servers
parameters:
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - in: path
    name: id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: The server numeric Id
  - in: path
    name: activation_token
    example: B54AWSVf3iIB3QWFs7eF3c6jiXS03ZJLqicyzCNpWMjpV5lR09Gj11naMwCu
    schema:
      type: string
      minimum: 60
    required: true
    description: The server activation token
requestBody:
  description: A JSON object containing list of additional parameters
  required: false
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/ExtraBodyParams'
responses:
  200:
    description: 'Ok'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ServerConnect'
  401:
    $ref: '#/components/responses/Unauthenticated'
  403:
    $ref: '#/components/responses/Forbidden'
  404:
    $ref: '#/components/responses/NotFound'
