summary: Get commands to be executed on the given server
tags:
  - Servers
parameters:
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - in: path
    name: id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: The server numeric Id
responses:
  200:
    description: 'Ok'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ServerCommands'
  409:
    $ref: '#/components/responses/Conflict'
