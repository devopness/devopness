type: object
properties:
  providers:
    description: "`self-hosted` if connecting to an existing server instance. May also be a list of cloud providers to which the server spec will be used to launch instances."
    type: array
    items:
      $ref: '#/components/schemas/BlueprintItem'
  databases:
    description: "The list of databases services that must be installed on the server"
    type: array
    items:
      $ref: '#/components/schemas/BlueprintItem'
    nullable: true
  tools:
    description: "A list of tools that must be made available on the server"
    type: array
    items:
      $ref: '#/components/schemas/BlueprintItem'
    nullable: true
required:
  - providers
