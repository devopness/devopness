type: object
properties:
  provider:
    description: "`self-hosted` if connecting to an existing server instance. May also be a list of cloud providers to which the server spec will be used to launch instances."
    enum: ['self-hosted']
    example: 'self-hosted'
    nullable: true
  services:
    description: "The list of services that must be installed on the server"
    type: array
    items:
      $ref: '#/components/schemas/ServiceCreate'
    nullable: true
  validate_web_public_access:
    description: If `true`, create a landing page on the server to validate if has public access
    type: boolean
    example: true
required:
  - provider
  - validate_web_public_access
