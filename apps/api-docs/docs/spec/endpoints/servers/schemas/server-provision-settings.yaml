type: object
description: Configuration used to launch cloud instance
properties:
  self_hosted:
    type: boolean
    description: Determines if the server is `self-hosted` or from a cloud service
    example: false
  credential_id:
    type: integer
    description: The unique id of the cloud provider credential to be used on connect to cloud provider
    example: 8430015757
  cloud_service:
    $ref: '#/components/schemas/ServerCloudService'
