type: object
properties:
  id:
    type: integer
    description: The unique id of the given record
    example: 9654123
  name:
    type: string
    description: The server's name
    example: web-srv-1
  hostname:
    type: string
    description: The server's hostname
    example: web-srv-1
  ip_address:
    type: string
    format: ipv4
    description: Public ipv4 address for server access
    example: 200.123.45.67
  ssh_port:
    type: integer
    description: The network port to which the SSH daemon is listening to SSH connections on the server
    example: 22
  created_by:
    type: integer
    description: The id of the user who created the server and to whom the server belongs
    example: 1
  active:
    type: boolean
    description: Tells if the server is active or not
  blueprint:
    $ref: '#/components/schemas/ServerBlueprint'
  status:
    $ref: '#/components/schemas/ActionStatus'
  actions:
    $ref: "#/components/schemas/Actions"
  environments:
    description: "The list of environments to which the server is linked to"
    type: array
    items:
      $ref: "#/components/schemas/EnvironmentRelation"
  provider_name:
    description: The name of the server's provider.
    type: string
    example: self-hosted
  provider_name_human_readable:
    description: The human readable version of the provider's name
    type: string
    example: VPS/Self Hosted
  created_by_user:
    $ref: "#/components/schemas/UserRelation"
  last_action:
    $ref: '#/components/schemas/ActionRelation'
  created_at:
    type: string
    format: date-time
    description: The date and time when the record was created
    example: '2019-09-25T15:50:48.000000Z'
  updated_at:
    type: string
    format: date-time
    description: The date and time when the record was last updated
    example: '2019-09-25T13:52:04.000000Z'
required:
  - id
  - name
  - hostname
  - ip_address
  - ssh_port
  - created_by
  - active
