summary: Retry an action
operationId: retryAction
tags:
  - Actions
parameters:
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - in: path
    name: action_id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: Numeric ID of the action to be retried
responses:
  201:
    description: 'Created'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Action'
  404:
    $ref: '#/components/responses/NotFound'
