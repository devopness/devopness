type: object
description: Object containing the data of the resource and informations about it
properties:
  id:
    type: integer
    description: The unique id of the resource
    example: 1839123
  type:
    $ref: '#/components/schemas/ResourceType'
    description: Name of the entity who the actions is related to
  type_human_readable:
    type: string
    description: Human readable version of the resource type
    example: Deployment
  data:
    type: object
    nullable: true
    description: The resource data of type specified on `resource.type`
    anyOf:
      - $ref: '#/components/schemas/ApplicationRelation'
      - $ref: '#/components/schemas/CronJobRelation'
      - $ref: '#/components/schemas/DaemonRelation'
      - $ref: '#/components/schemas/DeploymentRelation'
      - $ref: '#/components/schemas/NetworkRuleRelation'
      - $ref: '#/components/schemas/ServerRelation'
      - $ref: '#/components/schemas/ServiceRelation'
      - $ref: '#/components/schemas/SshKeyRelation'
      - $ref: '#/components/schemas/SslCertificateRelation'
required:
  - id
  - type
  - type_human_readable
