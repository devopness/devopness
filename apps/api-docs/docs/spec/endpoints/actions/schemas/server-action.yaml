type: object
description: An object representing the action dispatched to a specific server
properties:
  server_id:
    type: integer
    description: The Id of the server on which the action must be performed
    example: 4567890
  status:
    $ref: '#/components/schemas/ActionStatus'
  total_steps:
    type: integer
    minimum: 0
    maximum: 127
    description: The total number of steps to complete the action
    example: 5
  current_step:
    type: integer
    minimum: 0
    maximum: 127
    description: The current action step being executed
    example: 2
  current_step_message:
    type: string
    description: A message describing the current step being executed
    example: "Step 2 of 5: echo 'running' >> ~/test.log"
  started_at:
    type: string
    format: date-time
    description: The date and time when the action started to be executed (left the `pending/waiting` status)
    example: "2019-09-25T15:50:48.000000Z"
  completed_at:
    type: string
    format: date-time
    description: The date and time when the action has finished execution
    example: "2019-09-25T13:52:04.000000Z"
  created_at:
    type: string
    format: date-time
    description: The date and time when the record was created
    example: '2019-09-25T15:50:48.000000Z'
  updated_at:
    type: string
    format: date-time
    description: The date and time when the record was last updated
    example: '2019-09-25T13:52:04.000000Z'
