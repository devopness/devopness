summary: Get a member of team by ID
operationId: getTeamMember
tags:
  - Teams - Members
parameters:
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - in: path
    name: team_id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: Numeric ID of the team
  - in: path
    name: member_id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: Numeric ID of the member to be retrieved
responses:
  200:
    description: 'Ok'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Member'
  404:
    $ref: '#/components/responses/NotFound'
