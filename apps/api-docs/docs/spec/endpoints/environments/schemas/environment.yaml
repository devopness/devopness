type: object
properties:
  id:
    type: integer
    description: Unique id of the given record
    example: 16523
  name:
    type: string
    description: Environment's name
    example: 'produção'
  type:
    $ref: '#/components/schemas/EnvironmentType'
    description: The type of the deployment being triggered
  type_human_readable:
    description: The human readable version of the type
    type: string
    example: Staging
  servers:
    $ref: '#/components/schemas/Servers'
  cron_jobs:
    $ref: '#/components/schemas/CronJobs'
  daemons:
    $ref: '#/components/schemas/Daemons'
  network_rules:
    $ref: '#/components/schemas/NetworkRules'
  applications:
    $ref: '#/components/schemas/Applications'
  services:
    $ref: '#/components/schemas/Services'
  ssh_keys:
    $ref: '#/components/schemas/SshKeys'
  created_by_user:
    $ref: '#/components/schemas/UserRelation'
  created_at:
    type: string
    format: date-time
    description: The date and time when the record was created
    example: '2019-09-25T15:50:48.000000Z'
  updated_at:
    type: string
    format: date-time
    description: The date and time when the record was last updated
    example: '2019-09-25T13:52:04.000000Z'
required:
  - id
  - name
  - type
  - type_human_readable
  - servers
  - cron_jobs
  - daemons
  - network_rules
  - applications
  - services
  - ssh_keys
  - created_by_user
