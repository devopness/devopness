summary: Update a given environment
operationId: updateEnvironment
tags:
  - Environments
parameters:
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - in: path
    name: environment_id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: Unique ID of the environment to update
requestBody:
  description: A JSON object containing environment data
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/EnvironmentUpdate'
responses:
  204:
    $ref: '#/components/responses/NoContent'
  404:
    $ref: '#/components/responses/NotFound'
