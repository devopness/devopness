  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - in: path
    name: environment_id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: Unique ID of the environment to delete
responses:
  204:
    $ref: '#/components/responses/NoContent'
  404:
    $ref: '#/components/responses/NotFound'
