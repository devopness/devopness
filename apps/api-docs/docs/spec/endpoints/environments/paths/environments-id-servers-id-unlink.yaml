summary: Unlink/Remove a server from an environment
operationId: unlinkServerFromEnvironment
tags:
  - Environments - Servers
parameters:
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - in: path
    name: environment_id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: Unique ID of the environment
  - in: path
    name: server_id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: Unique ID of the server to unlink
requestBody:
  description: A JSON object containing environment server unlink optional parameters
  required: false
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/EnvironmentLinkItem'
responses:
  204:
    $ref: '#/components/responses/NoContent'
  404:
    $ref: '#/components/responses/NotFound'
