summary: Update an existing network rule
operationId: updateNetworkRule
tags:
  - Network Rules
parameters:
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - in: path
    name: network_rule_id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: Numeric ID of the rule to update
requestBody:
  description: A JSON object containing network rule data
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/NetworkRuleUpdate'
responses:
  204:
    $ref: '#/components/responses/NoContent'
  404:
    $ref: '#/components/responses/NotFound'
  422:
    $ref: '#/components/responses/ValidationError'
