summary: Get a network rule by ID
tags:
  - Network Rules
parameters:
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - in: path
    name: rule_id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: Numeric ID of the rule to get
responses:
  200:
    description: 'Ok'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/NetworkRule'
  404:
    $ref: '#/components/responses/NotFound'
