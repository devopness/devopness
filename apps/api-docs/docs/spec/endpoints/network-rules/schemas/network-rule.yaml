type: object
properties:
  id:
    type: integer
    description: The unique id of the given record
    example: 967864
  name:
    type: string
    description: The rule's name/description/reminder
    example: HTTPS|SSH|"Opening MySQL port so desktop apps can access it remotely"
  type:
    type: string
    description: The type of network traffic to which this rule will be applied
    enum: ['inbound', 'outbound']
    example: 'inbound'
  protocol:
    type: string
    description: The network protocol to which this rule will be applied.
    enum: ['any', 'tcp', 'udp']
    example: 'any'
  ip_address_from:
    type: string
    format: ipv4
    description: Starting range of the public ipv4 or ipv6 addresses that can access this rule
    example: 200.123.45.67
  ip_address_to:
    type: string
    format: ipv4
    description: Ending range of the public ipv4 or ipv6 addresses that can access this rule
    example: 200.123.45.99
  port_from:
    type: integer
    description: Starting range of network ports to be considered by this rule
    example: 6123
  port_to:
    type: integer
    description: Ending range of network ports to be considered by this rule
    example: 7654
  status:
    type: string
    description: Current status of deploying to remote servers the current network rule
    enum: ["pending", "in-progress", "cancelled", "completed", "failed"]
    example: "completed"
  created_at:
    type: string
    format: date-time
    description: The date and time when the record was created
    example: '2019-09-25T15:50:48+00:00'
  updated_at:
    type: string
    format: date-time
    description: The date and time when the record was last updated
    example: '2019-09-25T13:52:04+00:00'
required:
  - id
  - name
  - type
  - protocol
  - port_from
  - port_to
