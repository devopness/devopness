type: object
properties:
  id:
    type: integer
    description: The unique id of the given record
    example: 45678
  name:
    type: string
    description: The rule's name/description/reminder
    example: Open MySQL port for remote access
  type:
    $ref: '#/components/schemas/NetworkRuleType'
  protocol:
    $ref: '#/components/schemas/NetworkRuleProtocol'
  ip_address_from:
    type: string
    format: ipv4
    description: Starting range of the public ipv4 or ipv6 addresses that can access this rule
    example: 200.123.45.67
  ip_address_to:
    type: string
    format: ipv4
    description: Ending range of the public ipv4 or ipv6 addresses that can access this rule
    example: 200.123.45.99
  environments:
    $ref: '#/components/schemas/EnvironmentLinks'
required:
  - id
  - name
  - type
  - protocol
  - ip_address_from
  - ip_address_to
