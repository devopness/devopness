summary: Activate the current user account
operationId: activateUser
tags:
  - Users
parameters:
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - in: path
    name: user_id
    description: The unique ID of the user account to activate
    required: true
    example: 1
    schema:
      type: integer
      minimum: 1
  - in: path
    name: activation_hash
    description: The unique hash generated to active the account
    required: true
    example: 62cc6448356062a411d4283b148b3c0270f5d6ef
    schema:
      type: string
  - in: query
    name: expires
    description: The time limit to expires the URL
    required: true
    example: 1597366775
    schema:
      type: integer
  - in: query
    name: signature
    description: The signature of the URL generated by the API
    required: true
    example: 608cdf73050b7f9cfbc0412be83d5ae62071547b444f7053de507082ea11195b
    schema:
      type: string
responses:
  204:
    $ref: '#/components/responses/NoContent'
  403:
    $ref: '#/components/responses/Forbidden'
