type: object
properties:
  token:
    type: string
    description: The unique token generated by the API and sent to the user's e-mail address when the `send-reset-link` operation has been triggered.
    example: 55e16e05980a5ed3b48d8ace4282b6b3b9c92f4f2cf3d50f1c67e38a53e43b7d
  email:
    type: string
    description: The email of the user to reset the password
    example: my-email@devopness.com
  password:
    type: string
    description: The new password to define to user account
    example: my-password
  password_confirmation:
    type: string
    description: The new password again
    example: my-password
required:
  - token
  - email
  - password
  - password_confirmation
