type: object
properties:
  token_type:
    type: string
    example: Bearer
    description: The type of the authorization token being issued
  expires_in:
    type: integer
    example: 3600
    description: |
      The number of seconds remaining to the token expiration time,
      to be counted since the token issue date and time
  access_token:
    type: string
    example: 'eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIsImp0aSI6ImYwYjQxZjk1MTdiYWExOTg4Zjk...'
    description: The issued JWT access token
  refresh_token:
    type: string
    example: 'def50200a757a1c4dbc4859a4c47195632f4df60ebb521ac5a28a0b7553101f08f8b9...'
    description: |
      A token to be used after the original access token has expired, to issue a new token
      without requiring a new request to the `/users/login` endpoint
required:
  - access_token
  - refresh_token
