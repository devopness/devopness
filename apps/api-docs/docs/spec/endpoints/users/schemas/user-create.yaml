type: object
properties:
  email:
    type: string
    format: email
    description: The e-mail that will uniquely identify the user on the system and become its login credential
  name:
    type: string
    description: User's full name
    minLength: 5
    maxLength: 60
  password:
    type: string
    description: User's password
    format: password
    minLength: 3
    maxLength: 50
required:
  - email
  - name
  - password
