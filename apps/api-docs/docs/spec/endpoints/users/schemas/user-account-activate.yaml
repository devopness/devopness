type: object
properties:
  email:
    type: string
    description: The email of the user's account
    example: my-email@devopness.com
  token:
    type: string
    description: The security token of the account
    example: MTRiMGVmMzM5NDQzODJjZjY1NzE4ZTAzMjlkYTRjYjcwMDVkMmU1OTQxZmRl
  name:
    type: string
    description: The new user name to account
    example: My Name
  password:
    type: string
    description: The new password to account
    example: my-password
required:
  - email
  - token
  - name
  - password
