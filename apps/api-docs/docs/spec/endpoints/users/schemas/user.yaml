type: object
properties:
  id:
    type: integer
    description: The Id of the given user
    example: 1
  name:
    type: string
    description: User's full name
    minLength: 5
    maxLength: 60
  email:
    type: string
    format: email
    description: The e-mail that will uniquely identify the user on the system and become its login credential
  active:
    type: boolean
    description: Tells if the user is active or not
  created_at:
    type: string
    format: date-time
    description: The date and time when the record was created
    example: '2019-09-25 13:49:51'
  updated_at:
    type: string
    format: date-time
    description: The date and time when the record was last updated
    example: '2019-09-25 13:52:04'
  social_accounts:
    description: "The list of social accounts (source providers + login providers) connected to the user"
    type: array
    items:
      $ref: '#/components/schemas/SocialAccount'
required:
  - email
  - name
