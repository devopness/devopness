summary: Send invitation to user email to participate to a team
operationId: sendTeamInvitation
tags:
  - Teams - Invitations
parameters:
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - in: path
    name: team_id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: Numeric ID of the team to invite an user
requestBody:
  description: A JSON object containing the email to send the invitation
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/TeamInvitationCreate'
responses:
  201:
    description: 'Created'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/TeamInvitation'
  403:
    $ref: '#/components/responses/Forbidden'
  422:
    $ref: '#/components/responses/ValidationError'
