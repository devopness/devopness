type: object
properties:
  id:
    type: integer
    description: The unique id of the event
    example: 652674
  type:
    type: string
    description: The event type
    example: testtype
  resource_type:
    type: string
    description: The type of the resource that triggered the event
    example: Service
  resource_id:
    type: integer
    description: The id of the resource that triggered the event
    example: 652674
  message:
    type: string
    description: Text describing the event's origin and output
    example: "Test message"
    nullable: true
  triggered_by:
    type: integer
    description: ID of the user who triggered the event
    example: 2
    nullable: true
  created_at:
    type: string
    format: date-time
    description: The date and time when the record was created
    example: "2020-04-16T15:50:48.000000Z"
  updated_at:
    type: string
    format: date-time
    description: The date and time when the record was last updated
    example: "2020-04-16T15:50:48.000000Z"
required:
  - id
  - type
  - resource_type
  - resource_id
  - created_at
  - updated_at
