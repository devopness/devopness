type: object
properties:
  updated_at:
    type: string
    format: date-time
    description: The date and time when the requested log record was last updated
    example: '2019-09-25T13:52:04.000000Z'
    nullable: true
  server:
    $ref: '#/components/schemas/ServerRelation'
  step:
    $ref: '#/components/schemas/ServerActionLogStep'
required:
  - updated_at
