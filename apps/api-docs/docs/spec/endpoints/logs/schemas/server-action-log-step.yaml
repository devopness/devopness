type: object
nullable: true
properties:
  order:
    type: integer
    description: The execution order of the given step
    example: 3
  started_at:
    type: string
    format: date-time
    description: The date and time when the step started execution (i.e., left the `pending/queued` status)
    example: '2019-09-25T15:50:48.000000Z'
    nullable: true
  completed_at:
    type: string
    format: date-time
    description: The date and time when the step has finished execution
    example: '2019-09-25T13:52:04.000000Z'
    nullable: true
  output:
    type: string
    description: The full text output log
    nullable: true
required:
  - order
  - started_at
  - completed_at
  - output
