summary: Get action step log
operationId: getActionStepLog
tags:
  - Logs
parameters:
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - in: path
    name: action_id
    example: 9139
    schema:
      type: integer
    required: true
    description: Unique ID of the action to get logs from
  - in: path
    name: server_id
    example: 95189123
    schema:
      type: integer
    required: true
    description: Unique ID of the server to get logs from
  - in: path
    name: action_step_order
    example: 2
    schema:
      type: integer
    required: true
    description: Step's order number to get the logs from
responses:
  200:
    description: 'Ok'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ActionStepLog'
  404:
    $ref: '#/components/responses/NotFound'
