summary: Get action log
operationId: getActionLog
tags:
  - Logs
parameters:
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - in: path
    name: action_id
    example: 9139
    schema:
      type: integer
    required: true
    description: Unique ID of the action to get logs from
responses:
  200:
    description: 'Ok'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Log'
  404:
    $ref: '#/components/responses/NotFound'
