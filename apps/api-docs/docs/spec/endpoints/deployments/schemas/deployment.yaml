type: object
nullable: true
properties:
  id:
    type: integer
    description: The unique id of the given record
    example: 93457689064
  status:
    type: string
    description: Current status of the deployment
    enum: ['pending', 'in-progress', 'cancelled', 'completed', 'failed']
    example: 'completed'
  type:
    type: string
    description: The deployment type
    enum: [deploy, redeploy, rollback]
    example: 'deploy'
  source:
    type: string
    description: Source/channel from which the deployment has been triggered
    enum: ['manual', 'git-push', 'scheduled']
    example: 'manual'
  started_at:
    type: string
    format: date-time
    description: The date and time when the action started to be executed (left the `pending/waiting` status)
    example: '2019-09-25T15:50:48+00:00'
    nullable: true
  completed_at:
    type: string
    format: date-time
    description: The date and time when the action has finished execution
    example: '2019-09-25T13:52:04+00:00'
    nullable: true
  actions:
    description: "The list of actions related to the deployment"
    type: array
    items:
      $ref: '#/components/schemas/Action'
  commit:
    $ref: '#/components/schemas/Commit'
  steps:
    description: The steps that were meant to be executed when the deployment was triggered
    type: array
    items:
      $ref: '#/components/schemas/DeploymentStep'
  triggered_by_user:
    $ref: '#/components/schemas/User'
  created_at:
    type: string
    format: date-time
    description: The date and time when the record was created
    example: '2019-09-25T15:50:48+00:00'
    nullable: true
  updated_at:
    type: string
    format: date-time
    description: The date and time when the record was last updated
    example: '2019-09-25T13:52:04+00:00'
    nullable: true
required:
  - id
  - status
  - type
  - source
  - commit
  - steps
