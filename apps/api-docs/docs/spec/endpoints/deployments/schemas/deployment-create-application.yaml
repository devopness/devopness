type: object
properties:
  id:
    type: integer
    format: integer
    description: Numeric ID of the application
    example: 123
  name:
    type: string
    description: The applications's name
    example: my-awesome.app
  branch:
    type: string
    description: The name of the branch from which the source code should be retrieved and deployed
    example: 'master'
  hash:
    type: string
    description: The commit's full hash that uniquely identify a commit. Required when re-deploying
    example: '7ff09b0f2ed07625222f689d1afc29aa322b03a2'
required:
  - id
  - name
  - branch
