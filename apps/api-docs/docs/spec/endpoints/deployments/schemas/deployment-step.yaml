type: object
properties:
  order:
    type: integer
    description: The execution order of the given step
    example: 3
  name:
    type: string
    description: The step name
    example: 'Install dependencies'
  script_name:
    type: string
    nullable: true
    description: The name of the script linked to this step
    example: Run tests
  script_code:
    type: string
    nullable: true
    description: The source code of the script linked to this step
    example: php artisan test
  status:
    $ref: '#/components/schemas/ActionStatus'
  started_at:
    type: string
    format: date-time
    description: The date and time when the step started execution (i.e., left the `pending/queued` status)
    example: '2019-09-25T15:50:48.000000Z'
    nullable: true
  completed_at:
    type: string
    format: date-time
    description: The date and time when the step has finished execution
    example: '2019-09-25T13:52:04.000000Z'
    nullable: true
required:
  - name
  - order
  - status
