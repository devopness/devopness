type: object
properties:
  order:
    type: integer
    description: The execution order of the given step
    example: 3
  name:
    type: string
    description: The step name
    example: 'Install dependencies'
  status:
    $ref: '#/components/schemas/ActionStatus'
  started_at:
    type: string
    format: date-time
    description: The date and time when the step started to be executed (left the `pending/waiting` status)
    example: '2019-09-25T15:50:48.000000Z'
    nullable: true
  completed_at:
    type: string
    format: date-time
    description: The date and time when the step has finished execution
    example: '2019-09-25T13:52:04.000000Z'
    nullable: true
required:
  - name
  - order
  - status
