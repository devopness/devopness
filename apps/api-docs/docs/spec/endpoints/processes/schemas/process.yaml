type: object
properties:
  id:
    type: integer
    description: The Id of the given background process
    example: 1
  name:
    type: string
    description: The name entered by the user (or auto-generated by `devopness`) to uniquely identify the process
    example: 'my-app'
  command:
    type: string
    description: The command line to be executed to start the process
    example: "/usr/bin/example --parameter=%(ENV_VAR_TO_GET_PARAM_VALUE_FROM)s"
  working_directory:
    type: string
    description: The working directory where the process will be relative to when performing disk i/o
    example: "/path/to/your/app"
  process_count:
    type: integer
    description: The number of process instances of the program to run simultaneously
    example: 3
  run_as_user:
    type: string
    description: The name of the Unix user on behalf of which the process will run
    example: root
  auto_generated:
    default: false
    type: boolean
    description: Indicates if the command was auto_generated by `devopness` itself
required:
  - command
  - name
  - process_count
  - run_as_user
  - working_directory
