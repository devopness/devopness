summary: Restart a background process
tags:
  - Daemons/Processes
parameters:
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - in: path
    name: process_id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: Numeric ID of the process to restart
requestBody:
  description: A JSON object containing list of additional parameters
  required: false
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/ExtraBodyParams'
responses:
  200:
    description: 'Ok'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Process'
  404:
    $ref: '#/components/responses/NotFound'
