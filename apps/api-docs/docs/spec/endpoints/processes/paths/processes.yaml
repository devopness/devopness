summary: Add a background process to the given project
tags:
  - Projects - Processes
parameters:
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - in: path
    name: id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: The project numeric Id
requestBody:
  description: A JSON object containing backgroud process data
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/ProcessCreate'
responses:
  201:
    description: 'Created'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Process'
  422:
    $ref: '#/components/responses/ValidationError'
