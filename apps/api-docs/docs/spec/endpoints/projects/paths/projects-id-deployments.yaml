summary: Trigger a new deployment, on the current project
operationId: deployProjectApps
tags:
  - Projects - Deployments
parameters:
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - in: path
    name: project_id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: Numeric ID of the project for which a deployment is being triggered
requestBody:
  description: A JSON object containing deployment data
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/DeploymentCreate'
responses:
  201:
    $ref: '#/components/responses/Created'
  422:
    $ref: '#/components/responses/ValidationError'
