summary: Create a SSH key and link it to the given project
operationId: addSshKeyToProject
tags:
  - Projects - SSH Keys
parameters:
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - in: path
    name: project_id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: The project numeric Id
requestBody:
  description: A JSON object containing SSH key data
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/SshKeyCreate'
responses:
  201:
    description: 'Created'
    headers:
      X-Devopness-Action-Id:
        schema:
          type: integer
        description: The dispatched action id of the resource
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/SshKey'
  422:
    $ref: '#/components/responses/ValidationError'
