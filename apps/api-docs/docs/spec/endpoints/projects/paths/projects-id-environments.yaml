summary: Create a new environment, on the current project
operationId: addEnvironmentToProject
tags:
  - Projects - Environments
parameters:
  - $ref: "#/components/parameters/acceptHeader"
  - $ref: "#/components/parameters/authHeader"
  - $ref: "#/components/parameters/contentTypeHeader"
  - in: path
    name: project_id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: Numeric ID of the project to which an environment will be added
requestBody:
  description: A JSON object containing environment data
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/EnvironmentCreate"
responses:
  201:
    description: "Created"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/Environment"
  422:
    $ref: "#/components/responses/ValidationError"
