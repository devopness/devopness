summary: Get details of a single Source Code provider
operationId: getSourceProvider
tags:
  - Source Providers
parameters:
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - in: path
    name: source_provider_id
    example: 567
    schema:
      type: integer
      minimum: 3
    required: true
    description: Unique ID of the provider to be retrieved
responses:
  200:
    description: 'Ok'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/SocialAccount'
  404:
    $ref: '#/components/responses/NotFound'
