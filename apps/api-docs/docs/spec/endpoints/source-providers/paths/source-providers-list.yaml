summary: Return a list of all source code providers linked to current user
operationId: listSourceProviders
tags:
  - Source Providers
parameters:
  - $ref: "#/components/parameters/acceptHeader"
  - $ref: "#/components/parameters/authHeader"
  - $ref: "#/components/parameters/contentTypeHeader"
  - $ref: "#/components/parameters/pageNumber"
  - $ref: "#/components/parameters/pageSize"
responses:
  200:
    description: "Ok"
    headers:
      Link:
        schema:
          type: string
        description: Link header with `first`, `last`, `previous` and `next` page's links
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/SourceProviders"
