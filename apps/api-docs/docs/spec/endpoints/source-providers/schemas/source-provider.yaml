type: object
properties:
  id:
    type: integer
    description: The unique id of the given record
    example: 964
  displayable_name:
    type: string
    description: A formatted version of the `provider` field value, aligned with the provider's name branding
    enum: ['Bitbucket', 'GitHub', 'GitLab']
    example: 'GitHub'
  provider:
    type: string
    description: The name of the Source Authentication provider
    enum: ['bitbucket', 'github', 'gitlab']
    example: 'bitbucket'
  provider_user_nickname:
    type: string
    description: The nickname of the user on the Source Authentication provider
    example: 'Joe Smith'
  user_id:
    type: integer
    description: The current user's id
    example: 123
  created_at:
    type: string
    format: date-time
    description: The date and time when the record was created
    example: '2019-09-25T15:50:48+00:00'
  updated_at:
    type: string
    format: date-time
    description: The date and time when the record was last updated
    example: '2019-09-25T13:52:04+00:00'
required:
  - id
  - provider
  - provider_user_nickname
