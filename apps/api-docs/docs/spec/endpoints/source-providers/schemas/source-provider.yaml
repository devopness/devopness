type: object
nullable: true
properties:
  id:
    type: integer
    description: The unique id of the given record
    example: 964
  name:
    type: string
    example: 'github'
  name_human_readable:
    $ref: '#/components/schemas/SourceProviderDisplayableName'
  provider:
    $ref: '#/components/schemas/SourceProviderName'
  provider_user_nickname:
    type: string
    description: The nickname of the user on the Source Authentication provider
    example: 'Joe Smith'
  user_id:
    type: integer
    description: The current user's id
    example: 123
  created_at:
    type: string
    format: date-time
    description: The date and time when the record was created
    example: '2019-09-25T15:50:48.000000Z'
  updated_at:
    type: string
    format: date-time
    description: The date and time when the record was last updated
    example: '2019-09-25T13:52:04.000000Z'
required:
  - id
  - provider
  - provider_user_nickname
