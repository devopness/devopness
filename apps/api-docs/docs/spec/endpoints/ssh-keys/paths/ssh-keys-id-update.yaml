summary: Update an existing SSH key
operationId: updateSshKey
tags:
  - SSH Keys
parameters:
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - in: path
    name: ssh_key_id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: Numeric ID of the SSH key to be updated
requestBody:
  description: A JSON object containing SSH key data
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/SshKeyUpdate'
responses:
  204:
    $ref: '#/components/responses/NoContent'
  403:
    $ref: '#/components/responses/Forbidden'
  422:
    $ref: '#/components/responses/ValidationError'
