summary: Get a SSH key by ID
operationId: getSshKey
tags:
  - SSH Keys
parameters:
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - in: path
    name: ssh_key_id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: Numeric ID of the SSH key to get
responses:
  200:
    description: 'Ok'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/SshKeyWithRelations'
  404:
    $ref: '#/components/responses/NotFound'
