type: object
properties:
  id:
    type: integer
    description: The Id of the SSH key
    example: 1
  name:
    type: string
    description: The name entered by the user to uniquely identify the public SSH key
    example: 'my-laptop-ssh-key'
  environments:
    $ref: '#/components/schemas/EnvironmentLinks'
required:
  - id
  - name
