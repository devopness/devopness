summary: 'Return a list of all repositories belonging to a current user social provider account'
operationId: listRepositories
tags:
  - Source Providers - Repositories
parameters:
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - $ref: '#/components/parameters/pageNumber'
  - $ref: '#/components/parameters/pageSize'
  - in: path
    name: source_provider_id
    example: 567
    schema:
      type: integer
      minimum: 3
    required: true
    description: Unique ID of the provider where the repository is hosted
responses:
  200:
    description: 'Ok'
    headers:
      Link:
        schema:
          type: string
        description: Link header with `first`, `last`, `previous` and `next` page's links
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Repositories'
