summary: Lists cloud provider service regions
operationId: listCloudProviderServiceRegions
tags:
  - Static Data
parameters:
  - $ref: "#/components/parameters/acceptHeader"
  - $ref: "#/components/parameters/authHeader"
  - $ref: "#/components/parameters/contentTypeHeader"
  - in: path
    name: service_code
    example: aws-ec2
    schema:
      type: string
    required: true
    description: The unique id of the service
  - in: path
    name: region_code
    example: us-east-1
    schema:
      type: string
    required: true
    description: The unique id of the region

responses:
  200:
    description: "Ok"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/CloudInstances"
