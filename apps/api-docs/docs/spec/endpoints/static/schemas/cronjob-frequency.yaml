type: object
properties:
  value:
    type: string
    description: Frequency pattern to trigger the cronjob
    example: '0 0 1 * *'
  displayable:
    type: string
    description: Displayable text version of the frequency
    example: Monthly
  hint:
    type: string
    description: Text hint describing the frequency
    example: Run once a month at midnight on the first day of month
