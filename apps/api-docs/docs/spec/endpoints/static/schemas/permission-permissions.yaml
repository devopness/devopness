type: object
properties:
  name:
    type: string
    description: Name of permission
    example: create
  human_readable:
    type: string
    description: Human readable permission name
    example: Add
  hint:
    type: string
    description: Description of what a role is allowed to do with a resource if she has this permission
    example: Authorize to create new applications
  required_permissions:
    $ref: '#/components/schemas/RequiredPermissions'
required:
  - name
  - human_readable
  - hint
