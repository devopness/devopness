type: object
properties:
  value:
    description: The name of the provider
    type: string
    example: self-hosted
  human_readable:
    description: The formatted name of the provider
    type: string
    example: VPS/Self Hosted
  hint:
    type: string
    description: Text describing what is the provider
    example: Personal or rented server
required:
  - value
  - human_readable
  - hint
