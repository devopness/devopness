type: object
properties:
  resource_type:
    type: string
    description: The type of resource this permission affects
    example: application
  human_readable:
    type: string
    description: Human readable resource name
    example: Application
  permissions:
    type: array
    description: List of permissions available for this resource
    items:
      $ref: "#/components/schemas/PermissionPermissions"
required:
  - resource_type
  - human_readable
  - permissions
