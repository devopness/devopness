type: object
properties:
  name:
    type: string
    description: The internal name/code of the language runtime
    example: 'nodejs'
  name_human_readable:
    type: string
    description: The formatted name to be displayed in user interfaces
    example: 'Node.js'
  defaults:
    $ref: '#/components/schemas/LanguageRuntimeFrameworkDefaults'
required:
  - name
  - name_human_readable
  - defaults
