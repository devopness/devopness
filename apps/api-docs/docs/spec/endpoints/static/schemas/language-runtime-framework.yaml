type: object
properties:
  name:
    type: string
    description: The internal name/code of the language runtime
    example: 'nodejs'
  name_human_readable:
    type: string
    description: The formatted name to be displayed in user interfaces
    example: 'Node.js'
  defaults:
    description: Default values that apply to apps created in devopness using this framework
    properties:
      default_branch:
        type: string
        description: The version control branch that, by default, will be retrieved and deployed. This might be overriden by client apps API calls when actually triggering a new deployment.
        example: 'develop'
      push_to_deploy:
        description: Indicates if push to deploy webhooks are enabled for this application/environment, if so code will be deployed when commited to the default_branch
        type: boolean
        example: false
      programming_language:
        type: string
        description: The predominant programming language used in the application source code
        example: 'php'
      engine_version:
        description: The language runtime engine version to be used to execute this application code on the deployed servers
        type: string
        example: "19.03.2"
      framework:
        type: string
        description: The base framework on top of which the application has been implemented - if any
        example: 'drupal'
      app_directory:
        type: string
        description: The physical path of the application code/artifacts on the deployed servers
        example: "/var/www/my-app"
      root_directory:
        type: string
        description: The relative directory where package manager's manifest files (`package.json`, `composer.json`, `yarn.lock`, etc) are located. It needs to be set for applications where the actual source code is not located in the top level directory of the repository.
        example: "/ or /src or /lib/src or /code or /app"
      public_directory:
        type: string
        description: The relative web directory where publicly accessible assets are located and the web content should be served from
        example: "/public"
      entrypoint:
        type: string
        description: |
          The entrypoint tells devopness how an application should be started and has basically two forms:

          1) `File`: if it's a simple file name/path an web app will be served using the entrypoint value as its index file. Example: `index.html`

          2) `Command`: if a command line instruction is provided as the entrypoint value, it will be handled as the start up command that initalizes the application. It will be assumed that the user is an advanced user that knows what she/he is doing, therefore the command specified here will be run - as is - everytime the application needs to be started.
        example: "`index.html`, `index.php`, `server.php`, `default.htm`, `node server.js`, `yarn start`, `npm run production`, `docker run -d -P --name my_container_name my_image_name`, `php artisan serve –-host=192.168.2.20 --port=8000`"
      listening_address:
        description: Useful, for instance, when deploying `docker` containerized applications. If the application is not initialized by `devopness` itself, the user should inform the address at which the application listens to external calls. The address can be an IP, IP:PORT, HOSTNAME, HOSTNAME:PORT or unix:PATH
        type: string
        example: "`unix:/tmp/backend3`, `http://127.0.0.1:8000`, `127.0.0.1:3000`, `http://localhost`"
      build_command:
        description: The optional command that should be executed once during deployment to build the source code and get the application in a ready state.
        type: string
        example: "`docker build -t my_image_name .`, `yarn build`, `jekyll build`, `python build.py`"
      deployments_keep:
        type: integer
        description: The number of deployment history, logs and artifacts to keep stored in both devopness servers and user's servers
        example: 4
      install_dependencies_dev:
        description: Indicates if at deployment time we should execute package manager command to install dependencies used in development mode
        type: boolean
        example: false
      install_dependencies_prod:
        description: Indicates if at deployment time we should execute package manager command to install dependencies used in production mode
        type: boolean
        example: true
required:
  - name
  - name_human_readable
  - defaults
