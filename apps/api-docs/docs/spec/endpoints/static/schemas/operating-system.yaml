type: object
properties:
  code:
    type: string
    description: The name of the operating system
    example: ubuntu
  name:
    type: string
    description: The formatted name of the operating system
    example: Ubuntu
  value:
    type: string
    description: The name of the operating system
    example: ubuntu
  human_readable:
    type: string
    description: The formatted name of the operating system
    example: Ubuntu
  hint:
    type: string
    description: Text describing the operating system
    example: Ubuntu
  supported_versions:
    type: array
    description: List of operating system versions supported by Devopness
    items:
      type: object
      properties:
        version:
          type: string
          description: The system's version that is supported
          example: '18'
required:
  - code
  - name
