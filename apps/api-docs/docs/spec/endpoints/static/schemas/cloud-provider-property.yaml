type: object
description: Cloud provider setting's property
properties:
  name:
    type: string
    description: Name of the property
    example: access_key
  name_human_readable:
    type: string
    description: Human readable version of the property's name
    example: Access Key
  default_value:
    anyOf:
      - type: string
      - type: integer
      - type: boolean
    nullable: true
    description: Default property's value
    example: 'default_access_key'
  sensitive:
    type: boolean
    description: Defines if the property data is a sensitive content
    example: false
  validation:
    $ref: '#/components/schemas/CloudProviderPropertyValidation'
required:
  - name
  - name_human_readable
  - default_value
  - sensitive
  - validation
