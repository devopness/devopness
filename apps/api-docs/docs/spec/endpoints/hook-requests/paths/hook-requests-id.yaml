summary: Get a hook request by id
operationId: getHookRequest
tags:
  - Hooks - Requests
parameters:
  - $ref: "#/components/parameters/acceptHeader"
  - $ref: "#/components/parameters/authHeader"
  - $ref: "#/components/parameters/contentTypeHeader"
  - in: path
    name: hook_request_id
    example: "6fa16226-9dc4-4367-88aa-e689ad2bc580"
    schema:
      type: string
    required: true
    description: Unique ID of the hook request to be retrieved
responses:
  200:
    description: "Ok"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/HookRequest"
  404:
    $ref: "#/components/responses/NotFound"
