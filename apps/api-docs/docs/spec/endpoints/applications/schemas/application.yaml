type: object
properties:
  id:
    type: integer
    description: The unique id of the given record
    example: 445678964
  name:
    type: string
    description: A domain name that points to application main web address. Can be a naked domain or any subdomain. If app has domain names `testing.my-app.com`, `staging.my-app.com` and `www.my-app.com` a possible good candidate for the application name would be the "naked" domain `my-app.com`
    example: "my-app.co.uk"
  project_id:
    type: integer
    description: Numeric ID of the project that the application belongs to
  source_provider_id:
    type: integer
    description: Numeric ID of the source provider account where the repository is hosted. Required when the `repository` field is informed.
  repository:
    description: The full name of a repository (`repository_owner/repository_name`) containing the application source code. Required when the `source_provider_id` field is informed.
    type: string
    example: "devopness/devopness-web-site"
  repository_name:
    description: The name part of a repository full name (`repository_owner/repository_name`)
    type: string
    example: "devopness"
  repository_owner:
    description: The owner part of a repository full name (`repository_owner/repository_name`)
    type: string
    example: "devopness-web-site"
  programming_language:
    type: string
    description: The predominant programming language used in the application source code
    example: 'php'
  framework:
    type: string
    description: The base framework on top of which the application has been implemented - if any
    example: 'drupal'
  root_directory:
    type: string
    description: The relative directory where package manager's manifest files (`package.json`, `composer.json`, `yarn.lock`, etc) are located. It needs to be set for applications where the actual source code is not located in the top level directory of the repository.
    example: "/ or /src or /lib/src or /code or /app"
  public_directory:
    type: string
    description: The relative web directory where publicly accessible assets are located and the web content should be served from
    example: "/public"
  source_provider:
    description: "The source provider from where the application source code repository has been retrieved"
    $ref: '#/components/schemas/SocialAccount'
  deployment_settings:
    description: "The list of deployment settings for each application environment"
    type: array
    items:
      $ref: '#/components/schemas/ApplicationDeploymentSettings'
  environments:
    description: "The list of environments to which the application is linked to"
    type: array
    items:
      $ref: '#/components/schemas/Environment'
  status:
    type: string
    description: Current status of deploying to remote servers the current application
    enum: ["pending", "in-progress", "cancelled", "completed", "failed"]
    example: "completed"
required:
  - id
  - project_id
  - name
  - framework
  - programming_language
  - public_directory
