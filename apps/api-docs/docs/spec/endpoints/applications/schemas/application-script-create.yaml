type: object
properties:
  name:
    type: string
    description: Name/short description of the script
    example: Prepare for build project
  source_code:
    type: string
    description: A command line or multiline bash script
    example: echo "Configuring project..." && ./configure
  trigger_type:
    type: string
    description: The type of event that will trigger the script execution
    enum: [before, after]
    example: 'after'
  trigger_event:
    type: string
    description: The application deployment event to which the script is attached
    enum:  [get-new-release, install-dependencies, activate-new-release, remove-old-releases]
    example: 'install-dependencies'
  trigger_order:
    type: integer
    description: The relative order of the script execution in case the event has multiple scripts attached to it
    example: 2
required:
  - name
  - source_code
  - trigger_event
  - trigger_order
  - trigger_type
