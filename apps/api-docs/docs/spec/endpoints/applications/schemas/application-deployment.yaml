type: object
properties:
  type:
    type: string
    description: The type of the deployment being triggered
    enum: [deploy, redeploy, rollback]
    example: 'deploy'
  hash:
    type: string
    description: The commit's full hash that uniquely identify a commit. Required when re-deploying
    example: '4a03b9d21edeef8434c45818594a5d72027c14e7'
  created_at:
    type: string
    format: date-time
    description: The date and time when the record was created
    example: '2019-09-25T15:50:48+00:00'
  updated_at:
    type: string
    format: date-time
    description: The date and time when the record was last updated
    example: '2019-09-25T13:52:04+00:00'
required:
  - type
