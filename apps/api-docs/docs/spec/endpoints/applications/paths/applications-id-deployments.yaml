summary: Trigger a new deployment for current application
tags:
  - Applications - Deployments
parameters:
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - in: path
    name: application_id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: Numeric ID of the application to be deployed
responses:
  200:
    description: 'Ok'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ApplicationDeployment'
  404:
    $ref: '#/components/responses/NotFound'
