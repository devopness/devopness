summary: Trigger a new deployment for current application
operationId: deployApplication
tags:
  - Applications - Deployments
parameters:
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - in: path
    name: application_id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: Numeric ID of the application to be deployed
requestBody:
  description: A JSON object containing deployment parameters
  required: false
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/ApplicationDeployment'
responses:
  204:
    $ref: '#/components/responses/NoContentDispatchAction'
  404:
    $ref: '#/components/responses/NotFound'
