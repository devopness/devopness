summary: Create a new variable linked to an application
operationId: addVariableToApplication
tags:
  - Applications - Variables
parameters:
  - $ref: "#/components/parameters/acceptHeader"
  - $ref: "#/components/parameters/authHeader"
  - $ref: "#/components/parameters/contentTypeHeader"
  - in: path
    name: application_id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: Unique id of the application
requestBody:
  description: A JSON object containing application variable data
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/ApplicationVariableCreate"
responses:
  201:
    description: 'Created'
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/ApplicationVariable"
  404:
    $ref: "#/components/responses/NotFound"
