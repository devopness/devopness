type: object
properties:
  target_url:
    type: string
    nullable: true
    description: The target URL on outgoing hooks where Devopness should trigger a request
    example: "https://simple-example.test/hook/12345"
  trigger_when:
    type: array
    description: Conditions that must be met to trigger the hook.
    items:
      $ref: '#/components/schemas/HookOutgoingTriggerWhenCondition'
  settings:
    $ref: '#/components/schemas/HookOutgoingSetting'
required:
  - target_url
  - trigger_when
  - settings
