type: object
properties:
  id:
    type: string
    description: Unique ID of the hook to be updated
    example: "db3ca8c0-4977-11eb-9fbe-0242ac130003"
  name:
    type: string
    description: The name given to incoming hook
    example: My Incoming Hook
  requires_secret:
    type: boolean
    description: Determines if the hook requires a secret to be triggered
    example: false
  secret_algorithm:
    type: string
    description: The hash algorithm used to check payload integrity of the request
    example: sha256
  secret_header_name:
    type: string
    description: The request header used to give the secret to Devopness
    example: X-My-Secret
required:
  - id
  - name
  - requires_secret
