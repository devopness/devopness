type: object
properties:
  name:
    type: string
    description: Name of the condition
    example: 'Check pullrequest author'
  type:
    $ref: '#/components/schemas/HookIncomingTriggerWhenConditionType'
  path:
    type: string
    description: A dot-notation path of the request body where the value will be checked.
    example: pullrequest.author.nickname
  accepted_values:
    type: array
    description: An list of accepted values to checked field.
    items:
      anyOf:
        - type: boolean
        - type: integer
        - type: number
        - type: string
          nullable: true
    example:
      - myuser123
      - bu_nick456
required:
  - type
  - path
  - accepted_values
