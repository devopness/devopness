type: object
properties:
  id:
    type: string
    description: The Id of the given hook
    example: "f1a61a4e-4d08-11eb-9481-0242ac130004"
  name:
    type: string
    description: The name entered by the user (or auto-generated by `Devopness`) to uniquely identify the hook
    example: "my-app deploy"
  type:
    $ref: '#/components/schemas/HookType'
  url:
    type: string
    nullable: true
    description: The URL where the incoming hook must be triggered with a POST request
    example: "https://api.devopness.com/hooks-incoming/f1a61a4e-4d08-11eb-9481-0242ac130004"
  target_url:
    type: string
    nullable: true
    description: The target URL on outgoing hooks where Devopness should trigger a request
    example: "https://simple-example.test/hook/12345"
  requires_secret:
    default: false
    type: boolean
    description: Tells if requests to this hook must only be accepted when a HTTP header is sent with a message authentication code ([HMAC](https://en.wikipedia.org/wiki/HMAC)) generated based on the secret provided by Devopness and shared by user with external sources
  secret:
    type: string
    description: The secret generated by Devopness to be used to digitally sign incoming requests
    example: "nWE5NR3Z5SQYRrEtbotmG0mcu0Lloc1zZb4esrWifOIpM33LPvkicJYiQSqW"
  secret_header_name:
    type: string
    nullable: true
    description: The name of the HTTP request header from which the request digital signature should be extracted
    example: "X-Custom-Header"
  secret_algorithm:
    type: string
    nullable: true
    description: The cryptographic hash function to be used by Devopness when validating digitally signed incoming requests for hooks that require secret validation
    example: "sha256"
  verify_ssl:
    type: boolean
    description: Indicates if the Devopness must be verify the SSL certificate of the request
    example: true
  trigger_when:
    type: array
    items:
      type: string
    nullable: true
    description: A list of action status when the outgoing hook should be triggered by Devopness
    example: ["in-progress", "completed"]
  auto_generated:
    default: false
    type: boolean
    description: Indicates if the record was auto_generated by `devopness` itself
  action_type:
    $ref: '#/components/schemas/ActionType'
    description: The action type triggered by hook
  resource:
    $ref: '#/components/schemas/Resource'
  created_by_user:
    $ref: "#/components/schemas/User"
  settings:
    $ref: '#/components/schemas/HookSetting'
  created_at:
    type: string
    format: date-time
    description: The date and time when the record was created
    example: "2019-09-25T15:50:48.000000Z"
  updated_at:
    type: string
    format: date-time
    description: The date and time when the record was last updated
    example: "2019-09-25T13:52:04.000000Z"
required:
  - id
  - name
  - type
  - secret
  - verify_ssl
  - action_type
  - resource
  - created_at
  - updated_at
