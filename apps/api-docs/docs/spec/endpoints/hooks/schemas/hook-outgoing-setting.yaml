type: object
description: Settings to an outgoing hook
properties:
  request_headers:
    type: array
    description: List of outgoing hook request headers
    items:
      $ref: '#/components/schemas/HookOutgoingRequestHeader'
  request_body:
    description: The request body that should be send to target URL
    example: '{"content": "any-text"}'
    anyOf:
      - type: string
      - type: object
      - type: array
        items:
          type: object
