type: object
description: Variable that can be defined on trigger a incoming hook
properties:
  name:
    type: string
    description: The name of the variable
    example: environment_id
  path:
    type: string
    description: >
      A `dot-notation` path used to retrieve the variable's value.
      If not defined the `name` will be used instead.
    example: data.environment.id
  type:
    $ref: '#/components/schemas/HookVariableType'
  required:
    type: boolean
    description: Defines if the variable is required
    example: false
  default_value:
    oneOf:
      - type: string
      - type: number
      - type: boolean
      - type: array
        items:
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: object
          nullable: true
    nullable: true
    description: Optional variable assumes the default value if it's not given on the request to trigger the hook
    example: null
required:
  - name
  - type
  - required
