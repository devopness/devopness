summary: Update an existing incoming hook
operationId: updateIncomingHook
tags:
  - Hooks - Incoming
parameters:
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - in: path
    name: hook_id
    example: "db3ca8c0-4977-11eb-9fbe-0242ac130003"
    schema:
      type: string
    required: true
    description: Unique ID of the hook to be updated
requestBody:
  description: A JSON object containing incoming hook data
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/HookIncomingUpdate'
responses:
  204:
    $ref: '#/components/responses/NoContent'
  403:
    $ref: '#/components/responses/Forbidden'
  404:
    $ref: '#/components/responses/NotFound'
  422:
    $ref: '#/components/responses/ValidationError'
