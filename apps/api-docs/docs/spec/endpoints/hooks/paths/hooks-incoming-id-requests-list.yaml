summary: Returns a list of all hook requests belonging to an incoming hook
operationId: listIncomingHookRequests
tags:
  - Hooks - Requests
parameters:
  - $ref: "#/components/parameters/acceptHeader"
  - $ref: "#/components/parameters/authHeader"
  - $ref: "#/components/parameters/contentTypeHeader"
  - in: path
    name: hook_id
    example: "db3ca8c0-4977-11eb-9fbe-0242ac130003"
    schema:
      type: string
    required: true
    description: Unique ID of the incoming hook to retrieve request list
responses:
  200:
    description: "Ok"
    headers:
      Link:
        schema:
          type: string
        description: Link header with `first`, `last`, `previous` and `next` page's links
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/HookRequests"
  403:
    $ref: "#/components/responses/Forbidden"
