summary: Get an incoming hook by Id
operationId: getIncomingHook
tags:
  - Hooks - Incoming
parameters:
  - $ref: "#/components/parameters/acceptHeader"
  - $ref: "#/components/parameters/authHeader"
  - $ref: "#/components/parameters/contentTypeHeader"
  - in: path
    name: hook_incoming_id
    example: "db3ca8c0-4977-11eb-9fbe-0242ac130003"
    schema:
      type: string
    required: true
    description: Unique ID of the hook to be retrieved
responses:
  200:
    description: "Ok"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/HookIncoming"
  404:
    $ref: "#/components/responses/NotFound"
