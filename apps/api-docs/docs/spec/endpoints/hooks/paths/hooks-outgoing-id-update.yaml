summary: Update an existing outgoing hook
operationId: updateOutgoingHook
tags:
  - Hooks - Outgoing
parameters:
  - $ref: "#/components/parameters/acceptHeader"
  - $ref: "#/components/parameters/authHeader"
  - $ref: "#/components/parameters/contentTypeHeader"
  - in: path
    name: hook_outgoing_id
    example: "51921dfd-7544-4db1-b255-a226e5ea7033"
    schema:
      type: string
    required: true
    description: Unique ID of the outgoing hook to be updated
requestBody:
  description: A JSON object containing outgoing hook data
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/HookOutgoingUpdate'
responses:
  204:
    $ref: '#/components/responses/NoContent'
  403:
    $ref: '#/components/responses/Forbidden'
  404:
    $ref: '#/components/responses/NotFound'
  422:
    $ref: '#/components/responses/ValidationError'
