summary: Trigger an incoming hook associated action
operationId: triggerHook
tags:
  - Hooks - Incoming
parameters:
  - $ref: "#/components/parameters/acceptHeader"
  - $ref: "#/components/parameters/contentTypeHeader"
  - in: path
    name: hook_id
    example: "db3ca8c0-4977-11eb-9fbe-0242ac130003"
    schema:
      type: string
    required: true
    description: Unique ID of the hook to be triggered
requestBody:
  description: A JSON object containg hook variables
  required: false
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/HookIncomingTrigger'
responses:
  201:
    $ref: "#/components/responses/CreatedDispatchAction"
  204:
    $ref: "#/components/responses/NoContentDispatchAction"
  403:
    $ref: "#/components/responses/Forbidden"
  404:
    $ref: "#/components/responses/NotFound"
  422:
    $ref: "#/components/responses/ValidationError"
