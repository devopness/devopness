summary: Get an outgoing hook by Id
operationId: getOutgoingHook
tags:
  - Hooks - Outgoing
parameters:
  - $ref: "#/components/parameters/acceptHeader"
  - $ref: "#/components/parameters/authHeader"
  - $ref: "#/components/parameters/contentTypeHeader"
  - in: path
    name: hook_id
    example: "51921dfd-7544-4db1-b255-a226e5ea7033"
    schema:
      type: string
    required: true
    description: Unique ID of the outgoing hook to be retrieved
responses:
  200:
    description: "Ok"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/HookWithRelations"
  404:
    $ref: "#/components/responses/NotFound"
