type: object
properties:
  service_account_key:
    type: string
    description: The JSON key to service account of Google Cloud provider.
    example: |
      {
        "type": "service_account",
        "project_id": "project-name-12345",
        "private_key_id": "91612c57c42a125c7cdfa788f9ac659006721731",
        "private_key": "-----BEGIN PRIVATE KEY-----\nf5RDfS3aRzGyjcKsRLqQfpDWalRVgTWgpMhZwmdoZPkWFi3EPw1BmM\n-----END PRIVATE KEY-----\n",
        "client_email": "account-12345@project-name-12345.iam.gserviceaccount.com",
        "client_id": "764123001245678971239",
        "auth_uri": "https://accounts.google.com/o/oauth2/auth",
        "token_uri": "https://oauth2.googleapis.com/token",
        "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
        "client_x509_cert_url": "https://www.googleapis.com/robot/v1/metadata/x509/account-12345%40project-name-12345.iam.gserviceaccount.com"
      }
required:
  - service_account_key
