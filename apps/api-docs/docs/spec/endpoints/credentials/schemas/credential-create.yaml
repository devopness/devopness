type: object
properties:
  provider_id:
    type: integer
    description: The provider that this credential belongs to
    example: 3
  name:
    type: string
    description: The name of the credential
    example: My credential of AWS cloud provider
  key:
    type: string
    description: The key used to authenticate on cloud provider
    example: 3dlxAUgbuTJY0AitQMAFHd6JadVRw3rGml
  secret:
    type: string
    description: The secret used on AWS providers
    example: my-secret
required:
  - provider_id
  - name
  - key
