type: object
properties:
  provider_name:
    type: string
    description: The provider to which this credential belongs to
    example: aws
  name:
    type: string
    description: A name to uniquely identify this cloud provider credential
    example: AWS production account
  access_key:
    type: string
    description: The key used to authenticate on cloud provider
    example: 3dlxAUgbuTJY0AitQMAFHd6JadVRw3rGml
  secret:
    type: string
    description: The secret used to authenticate on this cloud provider
    example: my-secret
required:
  - provider_name
  - name
  - access_key
