type: object
properties:
  id:
    type: integer
    description: The unique cloud provider credential id
    example: 364910054
  created_by:
    type: integer
    description: The user id that created the credential
    example: 697031704
  name:
    type: string
    description: The name of the credential
    example: My credential of AWS cloud provider
  active:
    type: boolean
    description: Determines if the credential is current activated
    example: true
  provider:
    $ref: '#/components/schemas/CloudProvider'
  created_at:
    type: string
    format: date-time
    description: The date and time when the record was created
    example: '2019-09-25T15:50:48.000000Z'
  updated_at:
    type: string
    format: date-time
    description: The date and time when the record was last updated
    example: '2019-09-25T13:52:04.000000Z'
required:
  - id
  - provider_id
  - created_by
  - name
