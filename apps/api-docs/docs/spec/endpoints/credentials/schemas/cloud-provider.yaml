type: object
properties:
  code:
    type: string
    description: The code that uniquely identify a cloud provider
    example: aws|digital-ocean|gcp
  logo_url:
    type: string
    description: A URL path to the provider's logo image
    example: https://example.com/images/aws-logo.png
  name:
    type: string
    description: The name of the cloud provider
    example: Amazon Web Services
required:
  - code
  - logo_url
  - name
