type: object
properties:
  environment_id:
    type: integer
    description: The Id of the environment to which the settings apply to
    example: 3
  domains:
    description: The list of domain names to which the SSL certificate refers to
    type: array
    example: ['my-subdomain.example.com', 'example.com', '*.example.com']
    items:
      type: string
  issuer:
    $ref: '#/components/schemas/SslCertificateIssuer'
  type:
    $ref: '#/components/schemas/SslCertificateType'
  validation_level:
    $ref: '#/components/schemas/SslCertificateValidationLevel'
  custom_private_key:
    type: string
    description: The private key provided by the Certification Authority, when the certificate has not being automatically issued through `devopness`
    example: "-----BEGIN RSA PRIVATE KEY-----MIIJKQIBAAKCAgEA6AUEbdJa ..."
  custom_certificate:
    type: string
    description: The contents of the certificate provided by the Certification Authority, when the certificate has not being automatically issued through `devopness`
    example: "-----BEGIN CERTIFICATE-----MIIGdDCCBVygAwIBAgISAy66cNIj ..."
  environments:
    $ref: '#/components/schemas/EnvironmentLinks'
required:
  - environment_id
  - domains
  - issuer
  - type
