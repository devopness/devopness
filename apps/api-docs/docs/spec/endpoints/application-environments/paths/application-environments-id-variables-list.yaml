summary: Returns a list of variables belonging to an application environment
tags:
  - Applications - Environments
parameters:
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - in: path
    name: application_environment_id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: Unique ID of the application environment to retrieved variables from
responses:
  200:
    description: 'Ok'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ApplicationEnvironmentVariables'
