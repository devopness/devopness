summary: Add script to application environment as a deployment step
operationId: addScriptToApplicationEnvironment
tags:
  - Applications - Environments
parameters:
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - in: path
    name: application_environment_id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: Unique ID of the application environment to retrieve scripts from
requestBody:
  description: A JSON object containing application environment script data
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/ApplicationEnvironmentScriptCreate'
responses:
  201:
    description: 'Created'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ApplicationEnvironmentScripts'
  404:
    $ref: "#/components/responses/NotFound"
  422:
    $ref: '#/components/responses/ValidationError'
