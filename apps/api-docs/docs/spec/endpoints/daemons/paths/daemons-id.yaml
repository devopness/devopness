summary: Get a background process by ID
operationId: getDaemon
tags:
  - Daemons
parameters:
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - in: path
    name: daemon_id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: Numeric ID of the daemon to get
responses:
  200:
    description: 'Ok'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Daemon'
  404:
    $ref: '#/components/responses/NotFound'
