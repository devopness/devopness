summary: Update an existing background process
operationId: updateDaemon
tags:
  - Daemons
parameters:
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - in: path
    name: daemon_id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: Numeric ID of the daemon to update
requestBody:
  description: A JSON object containing daemon data
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/DaemonUpdate'
responses:
  204:
    $ref: '#/components/responses/NoContent'
  403:
    $ref: '#/components/responses/Forbidden'
  404:
    $ref: '#/components/responses/NotFound'
  422:
    $ref: '#/components/responses/ValidationError'
