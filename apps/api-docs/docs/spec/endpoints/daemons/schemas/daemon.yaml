type: object
properties:
  id:
    type: integer
    description: The Id of the given daemon
    example: 1
  name:
    type: string
    description: The name entered by the user (or auto-generated by `devopness`) to uniquely identify the daemon
    example: 'my-app'
  command:
    type: string
    description: The command line to be executed to start the daemon
    example: "/usr/bin/example --parameter=%(ENV_VAR_TO_GET_PARAM_VALUE_FROM)s"
  working_directory:
    type: string
    description: The working directory where the daemon will be relative to when performing disk i/o
    example: "/path/to/your/app"
  process_count:
    type: integer
    description: The number of daemon process instances of the program to run simultaneously
    example: 3
  run_as_user:
    type: string
    description: The name of the Unix user on behalf of which the daemon will run
    example: root
  auto_generated:
    default: false
    type: boolean
    description: Indicates if the command was auto_generated by `devopness` itself
  project:
    $ref: '#/components/schemas/ProjectRelation'
  application:
    $ref: '#/components/schemas/ApplicationRelation'
  environments:
    $ref: '#/components/schemas/Environments'
  servers:
    $ref: '#/components/schemas/Servers'
  last_action:
    $ref: '#/components/schemas/ActionRelation'
  created_at:
    type: string
    format: date-time
    description: The date and time when the record was created
    example: '2019-09-25T15:50:48.000000Z'
  updated_at:
    type: string
    format: date-time
    description: The date and time when the record was last updated
    example: '2019-09-25T13:52:04.000000Z'
required:
  - id
  - command
  - name
  - process_count
  - run_as_user
  - working_directory
  - project
  - application
  - environments
  - servers
  - last_action
