type: object
properties:
  id:
    type: integer
    description: The unique id of the given record
    example: 45678
  application_id:
    type: integer
    description: Numeric ID of the application to which the daemon belongs to
    example: 7123941090
  name:
    type: string
    description: The name entered by the user (or auto-generated by `devopness`) to uniquely identify the daemon
    example: 'my-app'
  command:
    type: string
    description: The command line to be executed to start the daemon
    example: "/usr/bin/example --parameter=%(ENV_VAR_TO_GET_PARAM_VALUE_FROM)s"
  working_directory:
    type: string
    description: The working directory where the daemon will be relative to when performing disk i/o
    example: "/path/to/your/app"
  process_count:
    type: integer
    description: The number of daemon process instances of the program to run simultaneously
    example: 3
  run_as_user:
    type: string
    description: The name of the Unix user on behalf of which the daemon will run
    example: root
  environments:
    $ref: '#/components/schemas/EnvironmentLinks'
required:
  - id
  - name
  - command
  - working_directory
  - process_count
  - run_as_user
