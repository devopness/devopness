type: object
properties:
  id:
    type: integer
    description: The unique id of the given team
    example: 1
  name:
    type: string
    description: The name of the given team
    example: Development Team
  photo_url:
    type: string
    description: The URL to team's image
    example: https://example.com/images/my_team.png
  environment:
    $ref: '#/components/schemas/EnvironmentRelation'
  project:
    $ref: '#/components/schemas/ProjectRelation'
  users:
    $ref: '#/components/schemas/Users'
  created_at:
    type: string
    format: date-time
    description: The date and time when the record was created
    example: '2019-09-25T15:50:48.000000Z'
  updated_at:
    type: string
    format: date-time
    description: The date and time when the record was last updated
    example: '2019-09-25T13:52:04.000000Z'
required:
  - id
  - name
  - photo_url
