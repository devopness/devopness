type: object
properties:
  project_id:
    type: string
    description: The ID of the project where the team will be created
    example: 64871301
  name:
    type: string
    description: The name of the team
    example: Development Team
  photo_url:
    type: string
    description: The URL to team's image
    example: https://example.com/images/my_team.png
required:
  - project_id
  - name
