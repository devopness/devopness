summary: 'Returns a list of all teams belonging to an environment'
operationId: listEnvironmentTeams
tags:
  - Environments - Teams
parameters:
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - $ref: '#/components/parameters/pageNumber'
  - $ref: '#/components/parameters/pageSize'
  - in: path
    name: environment_id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: Numeric ID of the environment to get teams from
responses:
  200:
    description: 'Ok'
    headers:
      Link:
        schema:
          type: string
        description: Link header with `first`, `last`, `previous` and `next` page's links
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Teams'
