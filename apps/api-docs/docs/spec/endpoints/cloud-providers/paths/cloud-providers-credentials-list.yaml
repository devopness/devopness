summary: List credentials of the given cloud provider
operationId: listCloudProviderCredentials
tags:
  - Cloud Providers
parameters:
  - $ref: "#/components/parameters/acceptHeader"
  - $ref: "#/components/parameters/authHeader"
  - $ref: "#/components/parameters/contentTypeHeader"
  - $ref: "#/components/parameters/pageNumber"
  - $ref: "#/components/parameters/pageSize"
  - in: path
    name: cloud_provider_code
    example: aws
    schema:
      type: string
    required: true
    description: Code of the cloud provider to get credentials from
responses:
  200:
    description: "Ok"
    headers:
      Link:
        schema:
          type: string
        description: Link header with `first`, `last`, `previous` and `next` page's links
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/Credentials"
