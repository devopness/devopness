type: object
properties:
  id:
    type: integer
    description: The pipeline step's ID
    example: 19876
  script_id:
    type: integer
    description: The script's ID of this pipeline step
    example: 9752
  name:
    type: string
    description: Name of the pipeline step
    example: Extra step before build app
  type:
    type: string
    description: The pipeline step's type
    example: default-step
  command:
    type: string
    description: A command line or multiline bash pipeline step
    example: "echo 'Deploy with devopness is a breeze!' | tee -a /tmp/build-started.log"
  runner:
    $ref: '#/components/schemas/PipelineStepRunnerName'
  run_as_user:
    type: string
    description: The name of the Unix user on behalf of which the script will be executed
    example: devopness
  trigger_order:
    type: integer
    description: The relative order of the pipeline step execution in case the event has multiple pipeline step attached
    example: 2
  is_auto_generated:
    type: boolean
    description: True if this step is auto-generated or false if this was created by the user
    example: false
  is_default_step:
    type: boolean
    description: True if this step is a default step of the pipeline and cannot be updated/deleted
    example: false
  created_at:
    type: string
    format: date-time
    description: The date and time when the record was created
    example: "2019-09-25T13:49:51.000000Z"
  updated_at:
    type: string
    format: date-time
    description: The date and time when the record was last updated
    example: "2019-09-25T13:52:04.000000Z"
required:
  - id
  - script_id
  - name
  - type
  - command
  - runner
  - run_as_user
  - trigger_order
  - is_auto_generated
  - is_default_step
