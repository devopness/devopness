type: object
properties:
  id:
    type: integer
    description: The Id of the given script
    example: 19876
  created_by:
    type: integer
    description: The id of the user that own the script
    example: 984123
  name:
    type: string
    description: Name/short description of the script
    example: Extra step before build app
  command:
    type: string
    description: A command line or multiline bash script
    example: "echo 'Deploy with devopness is a breeze!' | tee -a /tmp/build-started.log"
  runner:
    $ref: '#/components/schemas/PipelineStepRunnerName'
  run_as_user:
    type: string
    description: The name of the Unix user on behalf of which the script will be executed
    example: devopness
  trigger_order:
    type: integer
    description: The relative order of the script execution in case the event has multiple scripts attached
    example: 2
  created_at:
    type: string
    format: date-time
    description: The date and time when the record was created
    example: "2019-09-25T13:49:51.000000Z"
  updated_at:
    type: string
    format: date-time
    description: The date and time when the record was last updated
    example: "2019-09-25T13:52:04.000000Z"
required:
  - id
  - created_by
  - name
  - command
  - runner
  - run_as_user
  - trigger_order
