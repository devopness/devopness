summary: Returns a list of pipelines to a resource
operationId: listPipelines
tags:
  - Pipelines - Resources
parameters:
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - $ref: '#/components/parameters/pageNumber'
  - $ref: '#/components/parameters/pageSize'
  - in: path
    name: resource_type
    example: application
    schema:
      type: string
    required: true
    description: Pipeline's resource type to get pipelines from
  - in: path
    name: resource_id
    example: 323
    schema:
      type: integer
    required: true
    description: Unique ID of the resource to get pipelines from
responses:
  200:
    description: 'Ok'
    headers:
      Link:
        schema:
          type: string
        description: Link header with `first`, `last`, `previous` and `next` page's links
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Pipelines'
