summary: Creates a step for a pipeline
operationId: createPipelineStep
tags:
  - Pipelines - Steps
parameters:
  - $ref: "#/components/parameters/acceptHeader"
  - $ref: "#/components/parameters/authHeader"
  - $ref: "#/components/parameters/contentTypeHeader"
  - in: path
    name: pipeline_id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: Unique ID of the pipeline to add the step to
requestBody:
  description: A JSON object containing pipeline script data
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PipelineStepCreate"
responses:
  201:
    description: "Created"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/PipelineStep"
  404:
    $ref: "#/components/responses/NotFound"
  422:
    $ref: "#/components/responses/ValidationError"
