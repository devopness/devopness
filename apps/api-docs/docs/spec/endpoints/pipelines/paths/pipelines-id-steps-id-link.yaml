summary: Link a step to a pipeline
operationId: linkStepToPipeline
tags:
  - Pipelines - Steps
parameters:
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - in: path
    name: pipeline_id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: Unique ID of the pipeline
  - in: path
    name: pipeline_step_id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: Unique ID of the step to be linked
responses:
  204:
    $ref: '#/components/responses/NoContent'
  404:
    $ref: '#/components/responses/NotFound'
