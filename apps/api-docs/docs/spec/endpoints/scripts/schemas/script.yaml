type: object
properties:
  id:
    type: integer
    description: The Id of the given script
    example: 19876
  application_id:
    type: integer
    description: The id of the application to be linked
    example: 9471
  user_id:
    type: integer
    description: The id of the user that own the script
    example: 984123
  name:
    type: string
    description: Name/short description of the script
    example: Extra step before build app
  source_code:
    type: string
    description: A command line or multiline bash script
    example: "echo 'Deploy with devopness is a breeze!' | tee -a /tmp/build-started.log"
  run_as_user:
    type: string
    description: The name of the Unix user on behalf of which the script will be executed
    example: devopness
  trigger_type:
    type: string
    description: The type of event that will trigger the script execution
    enum: [before, after]
    example: "after"
  trigger_event:
    type: string
    description: The application deployment event to which the script is attached
    enum:
      [
        get-new-release,
        install-dependencies,
        activate-new-release,
        remove-old-releases,
      ]
    example: "install-dependencies"
  trigger_order:
    type: integer
    description: The relative order of the script execution in case the event has multiple scripts attached
    example: 2
  created_at:
    type: string
    format: date-time
    description: The date and time when the record was created
    example: "2019-09-25T13:49:51.000000Z"
  updated_at:
    type: string
    format: date-time
    description: The date and time when the record was last updated
    example: "2019-09-25T13:52:04.000000Z"
required:
  - id
  - application_id
  - user_id
  - name
  - source_code
  - run_as_user
  - trigger_type
  - trigger_event
  - trigger_order
