type: object
properties:
  type:
    $ref: '#/components/schemas/ServiceName'
    example: redis
  auto_start:
    type: boolean
    default: false
    description: Tells if the service should start automatically on operating system boot
  initial_state:
    $ref: '#/components/schemas/ServiceInitialState'
  environments:
    $ref: "#/components/schemas/EnvironmentLinks"
  version:
    type: string
    description: The service version to be installed
    example: 5.7
required:
  - type
