type: object
properties:
  name:
    type: string
    description: The service name
    example: mysql
  version:
    type: string
    description: The service current installed version
    example: 5.7.29
  auto_generated:
    type: boolean
    default: false
    description: Indicates if the service was auto_generated by `devopness` itself
  auto_start:
    type: boolean
    default: false
    description: Indicates if the service is marked for start automatically on operating system boot
  initial_state:
    type: string
    default: 'started'
    description: The expected initial state of the service after installed
    enum: [started, stopped]
    example: 'stopped'
  description:
    type: string
    description: A description text describing the service
    example: MySQL Community Server
  # todo: re-think if status and started_at do actually belong here or linked to each server
  status:
    type: string
    description: The status of the service at the `updated_at` point in time
    enum: [active, reloading, inactive, failed, activating, deactivating]
    example: "active"
  started_at:
    type: string
    format: date-time
    description: The date and time when the service was started and wheng the uptime is calculated from
    example: "2019-04-05 09:32:56"
  created_at:
    type: string
    format: date-time
    description: The date and time when the record was created
    example: "2019-09-25 13:49:51"
  updated_at:
    type: string
    format: date-time
    description: The date and time when the record was last updated
    example: "2019-09-25 13:52:04"
required:
  - name
  - auto_generated
  - auto_start
  - initial_state
  - created_at
  - updated_at
