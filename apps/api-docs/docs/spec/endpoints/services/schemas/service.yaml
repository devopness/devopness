type: object
properties:
  id:
    type: integer
    description: The unique id of the given record
    example: 652674
  name:
    type: string
    description: The human readable service name
    example: MySQL
  type:
    type: string
    description: The service type
    example: mysql
  type_human_readable:
    type: string
    description: Formatted/human readable version of the service type
    example: MySQL
  version:
    type: string
    description: The service current installed version
    example: 5.7.29
    nullable: true
  auto_generated:
    type: boolean
    default: false
    description: Indicates if the service was auto_generated by `devopness` itself
  auto_start:
    type: boolean
    default: false
    description: Indicates if the service is marked for start automatically on operating system boot
  initial_state:
    $ref: '#/components/schemas/ServiceInitialState'
  description:
    type: string
    description: A text describing the service, provided by the service author
    example: MySQL Community Server
    nullable: true
  # started_at:
  #   type: string
  #   format: date-time
  #   description: The date and time when the service was started and wheng the uptime is calculated from
  #   example: "2019-04-05 09:32:56"
  created_at:
    type: string
    format: date-time
    description: The date and time when the record was created
    example: "2020-04-16T15:50:48.000000Z"
  updated_at:
    type: string
    format: date-time
    description: The date and time when the record was last updated
    example: "2020-04-16T15:50:48.000000Z"
  environments:
    $ref: '#/components/schemas/Environments'
  created_by_user:
    $ref: '#/components/schemas/UserRelation'
  project:
    $ref: '#/components/schemas/ProjectRelation'
  servers:
    $ref: '#/components/schemas/Servers'
  last_action:
    $ref: '#/components/schemas/ActionRelation'
required:
  - id
  - name
  - type
  - type_human_readable
  - auto_generated
  - auto_start
  - initial_state
  - created_at
  - updated_at
