type: object
properties:
  id:
    type: integer
    description: The unique id of the given record
    example: 652674
  name:
    type: string
    description: The service name
    example: mysql
  displayable_name:
    type: string
    description: Formatted/human readable version of the service name
    example: MySQL
  version:
    type: string
    description: The service current installed version
    example: 5.7.29
  auto_generated:
    type: boolean
    default: false
    description: Indicates if the service was auto_generated by `devopness` itself
  auto_start:
    type: boolean
    default: false
    description: Indicates if the service is marked for start automatically on operating system boot
  initial_state:
    type: string
    default: 'started'
    description: The expected initial state of the service after installed
    enum: [started, stopped]
    example: 'stopped'
  description:
    type: string
    description: A text describing the service, provided by the service author
    example: MySQL Community Server
  status:
    type: string
    description: Current status of deploying to remote servers the current service
    enum: ["pending", "in-progress", "cancelled", "completed", "failed"]
    example: "completed"
  # started_at:
  #   type: string
  #   format: date-time
  #   description: The date and time when the service was started and wheng the uptime is calculated from
  #   example: "2019-04-05 09:32:56"
  created_at:
    type: string
    format: date-time
    description: The date and time when the record was created
    example: "2019-09-25 13:49:51"
  updated_at:
    type: string
    format: date-time
    description: The date and time when the record was last updated
    example: "2019-09-25 13:52:04"
required:
  - id
  - name
  - auto_generated
  - auto_start
  - initial_state
  - created_at
  - updated_at
