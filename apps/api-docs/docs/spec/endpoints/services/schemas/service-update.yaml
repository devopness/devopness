type: object
properties:
  name:
    type: string
    description: The service name
    example: mysql
  auto_start:
    type: boolean
    default: false
    description: Indicates if the service is marked for start automatically on operating system boot
  initial_state:
    $ref: '#/components/schemas/ServiceInitialState'
  action:
    $ref: '#/components/schemas/ServiceAction'
  servers:
    description: The list of IDs of servers to which the service action must be performed
    type: array
    items:
      type: integer
      example: [1, 2, 3]
required:
  - name
  - action
