summary: Get details of a single service
operationId: getService
tags:
  - Services
parameters:
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - in: path
    name: service_id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: Unique ID of the service to get
responses:
  200:
    description: 'Ok'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ServiceWithRelations'
  404:
    $ref: '#/components/responses/NotFound'
