summary: Update status of a service
description: |
  Trigger a status update action for a service in all project servers asynchronously. To get the output of service status update action the endpoint [getServiceStatusLog](/#operation/getServiceStatusLog) should be invoked.
operationId: updateServiceStatus
tags:
  - Services
parameters:
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - in: path
    name: service_id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: The unique id of the service
requestBody:
  description: A JSON object containing the environment id
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/ServiceStatusUpdate'
responses:
  204:
    $ref: '#/components/responses/NoContent'
  403:
    $ref: '#/components/responses/Forbidden'
  404:
    $ref: '#/components/responses/NotFound'
