type: object
properties:
  provider:
    type: string
    description: The name of the Social Authentication provider
    enum: ['bitbucket', 'facebook', 'github', 'gitlab', 'google', 'linkedin']
    example: 'bitbucket'
  callback_code:
    type: string
    description: The temporary code forwarded by the OAuth provider as a parameter to our callback URL
    example: 'a606964974b5fb082971'
required:
  - provider
  - callback_code
