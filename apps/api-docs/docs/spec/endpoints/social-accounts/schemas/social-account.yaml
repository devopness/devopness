type: object
properties:
  id:
    type: integer
    description: The unique id of the given record
    example: 964
  displayable_name:
    type: string
    description: A formatted version of the `provider` field value, aligned with the provider's name branding
    enum: ['Bitbucket', 'Facebook', 'GitHub', 'GitLab', 'Google', 'LinkedIn']
    example: 'GitHub'
  provider:
    type: string
    description: The name of the Social Authentication provider
    enum: ['bitbucket', 'facebook', 'github', 'gitlab', 'google', 'linkedin']
    example: 'bitbucket'
  provider_user_nickname:
    type: string
    description: The nickname of the user on the Social Authentication provider
    example: 'Joe Smith'
  is_vcs:
    type: boolean
    description: Tells if the social account provider is a Source Code Provider/Version Control System. e.g. false for Facebook, true for Github
  user_id:
    type: integer
    description: The current user's id
    example: 123
  created_at:
    type: string
    format: date-time
    description: The date and time when the record was created
    example: '2019-09-25T15:50:48+00:00'
  updated_at:
    type: string
    format: date-time
    description: The date and time when the record was last updated
    example: '2019-09-25T13:52:04+00:00'
required:
  - id
  - provider
  - provider_user_nickname
