summary: Return a list of all Cron Jobs belonging to a project
operationId: listProjectCronJobs
tags:
  - Projects - Cron Jobs
parameters:
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - $ref: '#/components/parameters/pageNumber'
  - $ref: '#/components/parameters/pageSize'
  - in: path
    name: project_id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: Numeric ID of the project to get cron jobs from
responses:
  200:
    description: 'Ok'
    headers:
      Link:
        schema:
          type: string
        description: Link header with `first`, `last`, `previous` and `next` page's links
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/CronJobs'
