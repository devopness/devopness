summary: Add a Cron Job to the given project
operationId: addCronJobToProject
tags:
  - Projects - Cron Jobs
parameters:
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - in: path
    name: project_id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: The project numeric Id
requestBody:
  description: A JSON object containing cron job data
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/CronJobCreate'
responses:
  201:
    description: 'Created'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/CronJob'
  422:
    $ref: '#/components/responses/ValidationError'
