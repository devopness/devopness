summary: Add a scheduled task to the given project
operationId: addCronjobToProject
tags:
  - Projects - Cronjobs/Scheduled Tasks
parameters:
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - in: path
    name: project_id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: The project numeric Id
requestBody:
  description: A JSON object containing task data
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/TaskCreate'
responses:
  201:
    description: 'Created'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Task'
  422:
    $ref: '#/components/responses/ValidationError'
