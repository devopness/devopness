summary: Update an existing cron job
operationId: updateCronJob
tags:
  - Cron Jobs
parameters:
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - in: path
    name: cron_job_id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: Numeric ID of the cron job to update
requestBody:
  description: A JSON object containing cron job data
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/CronJobUpdate'
responses:
  204:
    $ref: '#/components/responses/NoContentDispatchAction'
  403:
    $ref: '#/components/responses/Forbidden'
  404:
    $ref: '#/components/responses/NotFound'
  422:
    $ref: '#/components/responses/ValidationError'
