summary: Get a CronJob by ID
operationId: getCronJob
tags:
  - Cron Jobs
parameters:
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - in: path
    name: cron_job_id
    example: 1
    schema:
      type: integer
      minimum: 1
    required: true
    description: Numeric ID of the cron job to get
responses:
  200:
    description: 'Ok'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/CronJobWithRelations'
  404:
    $ref: '#/components/responses/NotFound'
