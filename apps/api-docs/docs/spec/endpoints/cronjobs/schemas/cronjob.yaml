type: object
properties:
  id:
    type: integer
    description: The Id of the given cron job
    example: 19876
  name:
    type: string
    description: The name of the cron job
    example: My cool cron job
  command:
    type: string
    description: The command line to be executed when running the cron job
    example: "echo 'devopness rocks!' | tee -a /tmp/task-output.log"
  pattern:
    type: string
    description: A cron expression consisting of Minute, Hour, Day of Month, Month and Day of Week subexpressions
    example: "0 0 * * *"
  pattern_human_readable:
    type: string
    description: A translation of the cron expression to a readable string indicating its execution frequency.
    enum: ["Every Minute", "Hourly", "Daily", "Weekly", "Monthly", "Yearly"]
    example: "Every Minute"
  run_as_user:
    type: string
    description: The name of the Unix user on behalf of which the cron job will be executed
    example: root
  auto_generated:
    default: false
    type: boolean
    description: Indicates if the cron job was auto_generated by `devopness` itself
  status:
    type: string
    description: Current status of deploying to remote servers the current cron job
    enum: ["pending", "in-progress", "cancelled", "completed", "failed"]
    example: "completed"
required:
  - id
  - command
  - name
  - pattern
  - run_as_user
