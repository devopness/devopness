type: object
properties:
  id:
    type: integer
    description: The Id of the given cron job
    example: 19876
  name:
    type: string
    description: The name of the cron job
    example: My cool cron job
  command:
    type: string
    description: The command line to be executed when running the cron job
    example: "echo 'devopness rocks!' | tee -a /tmp/task-output.log"
  pattern:
    type: string
    description: A cron expression consisting of Minute, Hour, Day of Month, Month and Day of Week subexpressions
    example: "0 0 * * *"
  pattern_human_readable:
    $ref: '#/components/schemas/CronJobPattern'
  run_as_user:
    type: string
    description: The name of the Unix user on behalf of which the cron job will be executed
    example: root
  auto_generated:
    default: false
    type: boolean
    description: Indicates if the cron job was auto_generated by `devopness` itself
  application:
    $ref: '#/components/schemas/ApplicationRelation'
  environments:
    $ref: '#/components/schemas/Environments'
  created_by_user:
    $ref: '#/components/schemas/UserRelation'
  last_action:
    $ref: '#/components/schemas/ActionRelation'
  project:
    $ref: '#/components/schemas/ProjectRelation'
  servers:
    $ref: '#/components/schemas/Servers'
  created_at:
    type: string
    format: date-time
    description: The date and time when the record was created
    example: '2019-09-25T15:50:48.000000Z'
  updated_at:
    type: string
    format: date-time
    description: The date and time when the record was last updated
    example: '2019-09-25T13:52:04.000000Z'
required:
  - id
  - command
  - name
  - pattern
  - pattern_human_readable
  - run_as_user
  - auto_generated
