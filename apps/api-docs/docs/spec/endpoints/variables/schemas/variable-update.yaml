type: object
properties:
  application_id:
    type: integer
    description: The id of the application to be linked
    example: 9471
  key:
    type: string
    description: The unique key used to identify the variable on the target
    example: 'APP_URL'
  value:
    type: string
    description: The value to be assigned to this variable when deployed to its target
    example: 'https://staging.devopness.com'
  description:
    type: string
    description: A text describing the variable, provided by the end user
    example: 'Sample variable description'
  target:
    $ref: '#/components/schemas/VariableTarget'
  type:
    $ref: '#/components/schemas/VariableType'
  hidden:
    type: boolean
    default: false
    description: Indicates if the variable value should be visible or not in the deployment logs
required:
  - application_id
  - key
  - value
  - target
  - type
  - hidden
