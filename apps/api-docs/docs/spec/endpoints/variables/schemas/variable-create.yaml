type: object
properties:
  key:
    type: string
    description: |
      The unique key used to identify the variable on the target.
      When variable is of type `file`, this is the relative path
      to the file within the application directory.
    example: 'APP_URL'
  value:
    type: string
    maxLength: 21504
    description: |
      The value to be assigned to this variable when deployed to its target.
      When variable is of type `file`, this is the file content.
    example: 'https://staging.devopness.com'
  description:
    type: string
    description: A text describing the variable, provided by the end user
    example: 'Sample variable description'
  target:
    $ref: '#/components/schemas/VariableTarget'
  type:
    $ref: '#/components/schemas/VariableType'
  hidden:
    type: boolean
    default: false
    description: Indicates if the variable value should be visible or not in the deployment logs
required:
  - key
  - value
  - hidden
  - target
  - type
