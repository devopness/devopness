summary: Update an existing variable
operationId: updateVariable
tags:
  - Variables
parameters:
  - $ref: '#/components/parameters/acceptHeader'
  - $ref: '#/components/parameters/authHeader'
  - $ref: '#/components/parameters/contentTypeHeader'
  - in: path
    name: variable_id
    schema:
      type: integer
      minimum: 1
    required: true
    description: The unique id of the variable to be updated
    example: 1
requestBody:
  description: A JSON object containing variable data
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/VariableUpdate'
responses:
  204:
    $ref: '#/components/responses/NoContent'
  404:
    $ref: '#/components/responses/NotFound'
  422:
    $ref: '#/components/responses/ValidationError'