Ok: # HTTP Status Code: 200
  description: 'Ok'
  content:
    application/json:
      schema:
        type: object
Created: # HTTP Status Code: 201
  description: Created
CreatedDispatchAction: # HTTP Status Code: 201
  description: Created
  headers:
    X-Devopness-Action-Id:
      schema:
        type: integer
      description: The dispatched action id of the resource
Accepted: # HTTP Status Code: 202
  description: Accepted
NoContent: # HTTP Status Code: 204
  description: No Content
NoContentDispatchAction: # HTTP Status Code: 204
  description: No Content
  headers:
    X-Devopness-Action-Id:
      schema:
        type: integer
      description: The dispatched action id of the resource
Unauthenticated: # HTTP Status Code: 401
  description: Unauthenticated
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/ApiError'
Forbidden: # HTTP Status Code: 403
  description: Forbidden/Unauthorized
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/ApiError'
NotFound: # HTTP Status Code: 404
  description: The specified resource was not found
Conflict: # HTTP Status Code: 409
  description: The current request conflicts with server state
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/ApiError'
ValidationError: # HTTP Status Code: 422
  description: Unprocessable Entity/Validation Error
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/ApiError'
