  - name: API Tokens
    description: |
      API Tokens are the authentication method used by the `devopness` API.

      Every request must include a valid token in the `Authorization` header:
      ```
      Authorization: Bearer <your_api_token>
      ```

      There are two types of tokens available:

      - **API Token (project scoped):** restricted to resources of a specific project, with permissions defined by the role assigned to the token.
        See [Projects - API Tokens](#tag/Projects-API-Tokens)

      - **Personal Access Token (PAT):** inherits the permissions of the user who created it.
        See [Users - Personal Access Tokens](#tag/Users-Personal-Access-Tokens)

      More information about API Tokens can be found in the [API Tokens - Devopness Docs](https://devopness.com/docs/#todo-link-to-product-docs-api-tokens)
  - name: Projects - API Tokens
    description: |
      API Tokens (project scoped) provide **restricted access to resources within a specific project**.
      Permissions are defined by the role assigned to the token, making them ideal for automation's, scripts, or integrations that should not access resources outside the project.

      Include the token in all project-related requests using the `Authorization` header:
      ```
      Authorization: Bearer <your_api_token>
      ```

      For instructions on creating and managing project tokens, refer to the [API Token (project) - Devopness Docs](https://devopness.com/docs/#todo-link-to-product-docs-project-token)
  - name: Users - Personal Access Tokens
    description: |
      Personal Access Tokens (PATs) **inherit all permissions of the user who created them**.
      They allow performing any action that the user is authorized to do across all projects accessible by the account.

      Include the PAT in all API requests using the `Authorization` header:
      ```
      Authorization: Bearer <your_api_token>
      ```

      For instructions on creating and managing PATs, refer to the [Personal Access Tokens - Devopness Docs](https://devopness.com/docs/#todo-link-to-product-docs-personal-token)

  - name: Static Data
    description: |
      Client API applications might need to retrieve possible accepted values to fulfill their forms and allow end users to pick values from a list of valid data.
      All static data that need to be used through `devopness` API client applications is provided through the `/static/*` endpoints.
