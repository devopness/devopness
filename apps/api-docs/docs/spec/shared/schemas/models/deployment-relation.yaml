type: object
nullable: true
properties:
  id:
    type: integer
    description: The unique id of the given record
    example: 93457689064
  status:
    $ref: '#/components/schemas/ActionStatus'
  type:
    $ref: '#/components/schemas/DeploymentType'
  source:
    $ref: '#/components/schemas/DeploymentSource'
  commit:
    $ref: '#/components/schemas/Commit'
  steps:
    description: The steps that were meant to be executed when the deployment was triggered
    type: array
    items:
      $ref: '#/components/schemas/DeploymentStep'
  triggered_by_user:
    $ref: '#/components/schemas/UserRelation'
  last_action:
    $ref: '#/components/schemas/ActionRelation'
  started_at:
    type: string
    format: date-time
    description: The date and time when the action started execution (i.e., left the `pending/queued` status)
    example: '2019-09-25T15:50:48.000000Z'
    nullable: true
  completed_at:
    type: string
    format: date-time
    description: The date and time when the action has finished execution
    example: '2019-09-25T13:52:04.000000Z'
    nullable: true
  created_at:
    type: string
    format: date-time
    description: The date and time when the record was created
    example: '2019-09-25T15:50:48.000000Z'
    nullable: true
  updated_at:
    type: string
    format: date-time
    description: The date and time when the record was last updated
    example: '2019-09-25T13:52:04.000000Z'
    nullable: true
required:
  - id
  - status
  - type
  - source
  - commit
  - steps
