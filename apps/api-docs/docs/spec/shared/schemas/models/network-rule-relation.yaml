type: object
properties:
  id:
    type: integer
    description: The unique id of the given record
    example: 967864
  name:
    type: string
    description: The rule's name/description/reminder
    example: Opening MySQL port so desktop apps can access it remotely
  type:
    $ref: '#/components/schemas/NetworkRuleType'
  protocol:
    $ref: '#/components/schemas/NetworkRuleProtocol'
  ip_address_from:
    nullable: true
    type: string
    format: ipv4
    description: Starting range of the public ipv4 or ipv6 addresses that can access this rule
    example: 200.123.45.67
  ip_address_to:
    nullable: true
    type: string
    format: ipv4
    description: Ending range of the public ipv4 or ipv6 addresses that can access this rule
    example: 200.123.45.99
  port_from:
    type: integer
    description: Starting range of network ports to be considered by this rule
    example: 6123
  port_to:
    type: integer
    description: Ending range of network ports to be considered by this rule
    example: 7654
  last_action:
    $ref: '#/components/schemas/ActionRelation'
  created_at:
    type: string
    format: date-time
    description: The date and time when the record was created
    example: '2019-09-25T15:50:48.000000Z'
  updated_at:
    type: string
    format: date-time
    description: The date and time when the record was last updated
    example: '2019-09-25T13:52:04.000000Z'
required:
  - id
  - name
  - type
  - protocol
  - port_from
  - port_to
