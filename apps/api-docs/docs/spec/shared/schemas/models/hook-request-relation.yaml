type: object
nullable: true
properties:
  id:
    type: string
    description: The unique UUID of the hook request
    example: "6fa16226-9dc4-4367-88aa-e689ad2bc580"
  hook_id:
    type: string
    description: The UUID of the hook that the request belongs to
    example: "f1a61a4e-4d08-11eb-9481-0242ac130004"
  action_id:
    type: integer
    nullable: true
    description: The id of the action that the request belongs to
    example: 1985239
  retry_of:
    type: string
    nullable: true
    description: The UUID of the request that this request is a retry of
    example: "002afd04-e3af-4dad-bf46-b2b25978482a"
  ip_address:
    type: string
    description: The IP address of the source that triggered the hook
    example: "172.17.0.4"
  url:
    type: string
    description: Original URL used on the request
    example: "https://api.devopness.com/hooks-incoming/f1a61a4e-4d08-11eb-9481-0242ac130004"
  request_headers:
    type: object
    nullable: true
    description: The headers of the request
    example:
      Content-Type: application/json
      Accept: application/json
  request_body:
    type: object
    nullable: true
    description: The body of the request
    example:
      message: Hello World
  response_status_code:
    type: integer
    description: The response status code
    example: 200
  response_headers:
    type: object
    nullable: true
    description: The headers of the response
    example:
      Content-Type: application/json
      Accept: application/json
  response_body:
    type: object
    nullable: true
    description: The body of the response
    example:
      success: true
  created_at:
    type: string
    format: date-time
    description: The date and time when the record was created
    example: '2019-09-25T15:50:48.000000Z'
    nullable: true
  updated_at:
    type: string
    format: date-time
    description: The date and time when the record was last updated
    example: '2019-09-25T13:52:04.000000Z'
    nullable: true
required:
  - id
  - hook_id
  - action_id
  - retry_of
  - ip_address
