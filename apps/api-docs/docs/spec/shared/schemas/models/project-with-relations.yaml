type: object
properties:
  id:
    type: integer
    description: The unique id of the given record
    example: 45678
  user_id:
    type: integer
    description: The id of the user that own the project
    example: 984123
  name:
    type: string
    description: The project's name
    example: 'my project'
  logo_image:
    type: string
    description: A base64 string representation of the logo image
    example: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAACACA.../AgwAgJqsE2/7ccAAAAAASUVORK5CYII="
  logo_url:
    type: string
    format: url
    description: A URL path to the project's logo image
    example: https://example.com/projects-beautiful-logo.png
    nullable: true
  ssh_keys:
    description: "The list of SSH keys added to the project"
    type: array
    items:
      $ref: '#/components/schemas/SshKey'
  os_users:
    description: "The list of the operating system users found in all the servers linked to a project"
    type: array
    items:
      properties:
        name:
          type: string
      example:
        name: devopness
  applications:
    $ref: '#/components/schemas/Applications'
  cron_jobs:
    $ref: '#/components/schemas/CronJobs'
  environments:
    $ref: '#/components/schemas/Environments'
  network_rules:
    $ref: '#/components/schemas/NetworkRules'
  daemons:
    $ref: '#/components/schemas/Daemons'
  servers:
    $ref: '#/components/schemas/Servers'
  services:
    $ref: '#/components/schemas/Services'
required:
  - id
  - user_id
  - name
