type: object
properties:
  role:
    type: string
    description: The role of the member on team
    example: member
  created_at:
    type: string
    format: date-time
    description: The date and time when the record was created
    example: '2021-09-23T15:50:48.000000Z'
  updated_at:
    type: string
    format: date-time
    description: The date and time when the record was last updated
    example: '2021-09-23T13:52:04.000000Z'
  user:
    $ref: '#/components/schemas/UserRelation'
required:
  - role
  - user
