type: object
properties:
  hash:
    type: string
    description: The commit comment's full hash that uniquely identify it
    example: '4a03b9d21edeef8434c45818594a5d72027c14e7'
  message:
    type: string
    description: The commit's comment message
    example: "Good developers always add messages to their commits"
  committed_at:
    type: string
    format: date-time
    description: The date and time when the commit has been submitted
    example: '2019-09-25 13:49:51'
  provider:
    type: string
    description: The source provider where the commit has been retrieved from
    enum: ['bitbucket', 'github', 'gitlab']
    example: 'github'
  repository:
    type: string
    description: The full name of the repository (`owner/repository`) to which the commit belongs to
    example: 'devopness/devopness-site'
  branch:
    type: string
    description: The name of the branch of which the commit was the head at the time of its retrieval
    example: 'develop'
  url:
    type: string
    format: url
    description: The direct URL for accessing commit details on the provider's web application
    example: "https://github.com/myusername/myrepo"
  author_email:
    type: string
    format: email
    description: The e-mail of the commit's author
  author_name:
    type: string
    description: The name of the commit's author
    example: 'feature/some-branch'
