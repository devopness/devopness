type: object
properties:
  message:
    type: string
    description: The main exception raised by the server
    example: The given data was invalid.
  errors:
    type: object
    description: Optional error object containing details of the server error
    properties:
      field_name:
        type: array
        description: Error message specific to each field included in the errors object
    example:
      field_1: The field 'field_1' is required
      field_2: The field 'field_2' is not of the expected type
required:
  - message
