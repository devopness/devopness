# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: CI

on:
  pull_request:
    branches:
      - main

    paths:
      - docs/**
      - src/**
      - dredd.yml
      - jest.config.js
      - package*.json

jobs:
  build:
    name: Build and test

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        node-version: [16.x]
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Download latest API generated docs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: npm run api-docs-zip-download

      - name: Extract downloaded content
        run: npm run api-docs-zip-extract

      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: 'docs: Update API generated files'
          file_pattern: 'docs/spec/*'

      - name: Build API Docs
        run: npm run build
