version = 1

# Generated-artifact registry.
#
# 54% of the lines in this repository are produced by a generator. Any metric
# computed without segregating those files is noise, so segregation happens here
# first and everything downstream inherits it.
#
# Invariants enforced by `tetanus classify`:
#
#   1. Every entry below matches at least one tracked file. A glob that matches
#      nothing is a stale registry, not a harmless no-op.
#   2. Every generated file is claimed by exactly one entry.
#   3. `foreign_generator = true` marks output owned by a generator outside
#      Tetanus. Those files are classified but never rendered, rewritten, or
#      drift-checked by Tetanus. This is what keeps Changesets owning the
#      per-package changelogs.

[[artifact]]
id = "sdk-js-api-models"
paths = ["packages/sdks/javascript/src/api/generated/**"]
generator = "openapi-generator-cli 4.3.1 (typescript-axios), custom templates"
command = "pnpm --filter @devopness/sdk-js run build-api-models"
inputs = [
  "packages/sdks/common/spec.json",
  "packages/sdks/javascript/openapitools.json",
  "packages/sdks/javascript/src/api/generator/templates/**",
]
committed = true
foreign_generator = false

[[artifact]]
id = "sdk-python-api-models"
paths = [
  "packages/sdks/python/src/devopness/generated/**",
  "packages/sdks/python/src/devopness/models.py",
]
generator = "openapi-generator-cli 7.25.0 (python), custom templates"
command = "make -C packages/sdks/python build-sdk-python"
inputs = [
  "packages/sdks/common/spec.json",
  "packages/sdks/python/generator/templates/**",
  "packages/sdks/python/scripts/build.py",
]
committed = true
foreign_generator = false

[[artifact]]
id = "api-spec-json"
paths = ["packages/sdks/common/spec.json", "docs/openapi.json"]
generator = "apps/api-docs spec build (yaml composition, swagger-cli validation)"
command = "pnpm --filter devopness-api-docs run api-build-spec && pnpm --filter devopness-api-docs run api-convert-spec-to-json"
inputs = ["apps/api-docs/docs/spec/**", "apps/api-docs/src/**"]
committed = true
foreign_generator = false

[[artifact]]
id = "api-spec-imported-models"
paths = ["apps/api-docs/docs/spec/auto-generated/**"]
generator = "imported from the Devopness API model archive by .github/scripts/sync-api-spec-import-auto-generated-models.sh"
command = "GitHub Actions: sync-api-spec.yml"
inputs = []
committed = true
foreign_generator = false

# Changesets owns these. The root CHANGELOG.md is NOT listed here: it is
# generated by Tetanus from living.toml, and listing it here would claim it
# twice.
[[artifact]]
id = "package-changelogs"
paths = ["packages/*/*/CHANGELOG.md"]
generator = "@changesets/cli via release-packages.yml"
command = "npx changeset version"
inputs = [".changeset/**", "packages/*/*/package.json"]
committed = true
foreign_generator = true
